receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s

# F10 (D-59): el collector no depende de ningun backend encendido.
# - Metricas: exporter Prometheus en modo pull (:9464). Si Prometheus esta apagado nadie lo lee y
#   no hay reintentos ni ruido; al encender el perfil `observability` lo raspa directamente.
# - Trazas y logs: `nop` (descarte explicito, sin errores de conexion). Para enviarlos a Tempo/Loki,
#   descomentar esos servicios en docker-compose.yml y cambiar los pipelines a los exporters de abajo.
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  nop:
  # otlp_grpc/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true
  # otlp_http/loki:
  #   endpoint: http://loki:3100/otlp
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
