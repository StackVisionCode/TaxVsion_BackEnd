global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taxvision-otel-collector
    # El exporter Prometheus del collector ya trae su propio label "job" por
    # servicio (derivado de service.name via AddTaxVisionOpenTelemetry, ej.
    # "auth-service"/"customer-service") en cada metrica que reenvia — sin
    # honor_labels, Prometheus lo pisa con el job_name de este scrape config
    # (todo quedaria como "taxvision-otel-collector", sin poder distinguir
    # servicio por servicio) y lo manda a "exported_job" en su lugar.
    honor_labels: true
    static_configs:
      - targets:
          - otel-collector:9464

  # Metricas de contenedores (CPU/memoria/IO por servicio, incluye minio).
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # Metricas del host (disco, memoria, CPU del server) — critico para vigilar que
  # el volumen minio-data no se llene en silencio. La base ya no esta en este host:
  # su disco se vigila desde el servidor Ubuntu que la aloja, no desde aca.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # H-16 — profundidad por cola, incluida la dead-letter.
  #
  # Wolverine crea y usa `wolverine-dead-letter-queue` el solo (AutoProvision): un handler
  # que agota los reintentos acaba ahi. El agujero nunca fue que faltara la DLQ, es que
  # nadie la miraba. Los mensajes sin handler NO llegan aqui — Wolverine los descarta, que
  # con el fanout actual es lo correcto: cada cola recibe los ~183 tipos de evento y solo
  # maneja un puñado.
  #
  # Hace falta /metrics/detailed: el /metrics normal solo da el agregado del broker, sin
  # desglose por cola, y sin desglose no se puede alertar solo sobre las DLQ.
  # El puerto 15692 no se publica al host — Prometheus entra por la red interna.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
