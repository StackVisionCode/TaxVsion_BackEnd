      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Auditoria RateLimit hallazgo #2 — primer acquirer M2M saliente de Growth (antes solo
      # RECIBIA llamadas M2M vía /internal/*), solo para leer el catalogo de PlanRateLimits de
      # Subscription.
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${GROWTH_SERVICE_CLIENT_ID:-growth-worker}
      ServiceAuthClient__ClientSecret: ${GROWTH_SERVICE_CLIENT_SECRET:-}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
    volumes:
