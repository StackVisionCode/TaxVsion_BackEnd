  #     - "4318"
  #   networks:
  #     - taxvision-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: taxvision-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    # INFRA-01 — sin `ports:`. Los 19 servicios llegan por DNS interno de Docker
    # (http://otel-collector:4317), que atraviesa la red bridge y no el port mapping. Publicarlo
    # dejaba el receptor OTLP abierto a internet: Docker escribe sus reglas iptables por debajo de
    # UFW, asi que un `ufw deny 4317` no lo tapaba. Con tenant_id en los atributos, cualquiera
    # podria inyectar spans con el tenant de otro cliente y envenenar dashboards y auditoria.
    expose:
      - "4317"
      - "4318"
      - "9464"
    mem_limit: 512m
    # Backends detenidos: el collector arranca igual y traga los spans/metricas de los
    # 19 servicios (los descarta). Sin este depends_on no queda referencia colgando.
    # depends_on:
    #   - loki
    #   - tempo
    networks:
      - taxvision-network

  # Metricas de contenedores (CPU/memoria/IO por servicio) — sin esto Prometheus
  # solo tiene metricas de aplicacion (OTel), cero visibilidad de infraestructura.
  # cadvisor:
