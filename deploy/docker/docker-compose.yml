      Jwt__Audience: TaxVision.Services
      # Proveedor SMS global (MVP). El adapter concreto y sus secretos se configuran por env
      # Sms__Providers__<code>__... ; por defecto arranca con el proveedor "fake" para dev/E2E.
      Sms__DefaultProvider: ${SMS_DEFAULT_PROVIDER:-fake}
      # Failover de plataforma (opcional): orden priorizado de proveedores. Vacío = solo DefaultProvider.
      # Ej: SMS_PROVIDER_ORDER_0=infobip SMS_PROVIDER_ORDER_1=textmaxx → Infobip y si rechaza/cae, Textmaxx.
      Sms__ProviderOrder__0: ${SMS_PROVIDER_ORDER_0:-}
      Sms__ProviderOrder__1: ${SMS_PROVIDER_ORDER_1:-}
      Sms__ProviderOrder__2: ${SMS_PROVIDER_ORDER_2:-}
      # Infobip: BaseUrl y SenderId no son secretos; la API key SÍ (Authorization: App {key}).
      # Para activar Infobip: SMS_DEFAULT_PROVIDER=infobip + SMS_INFOBIP_API_KEY en .env.
      Sms__Providers__generic__BaseUrl: ${SMS_GENERIC_BASE_URL:-}
      Sms__Providers__infobip__BaseUrl: ${SMS_INFOBIP_BASE_URL:-}
      Sms__Providers__infobip__SenderId: ${SMS_INFOBIP_SENDER_ID:-InfoSMS}
      Sms__Providers__infobip__Auth__Credential: ${SMS_INFOBIP_API_KEY:-}
      Sms__Providers__infobip__Webhook__Secret: ${SMS_INFOBIP_WEBHOOK_SECRET:-}
      # Twilio: Credential = 'AccountSid:AuthToken' (SECRETO). SenderId = número From (+1...) o Messaging Service Sid.
      Sms__Providers__twilio__Auth__Credential: ${SMS_TWILIO_CREDENTIAL:-}
      Sms__Providers__twilio__SenderId: ${SMS_TWILIO_FROM:-}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
