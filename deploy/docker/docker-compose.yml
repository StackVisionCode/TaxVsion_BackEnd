  #     - prometheus
  #     - loki
  #     - tempo
  #   networks:
  #     - taxvision-network

  tenant-api:
    image: taxvision/tenant-api:dev
    container_name: taxvision-tenant-api
    build:
      context: ../..
      dockerfile: src/Services/Tenant/TaxVision.Tenant.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${TENANT_DB_CONNECTION:?Set TENANT_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Logo del tenant (Tenant_Service_LogoSupport_Plan.md) — cliente M2M para pedir el
      # download-url presignado y borrar el logo reemplazado/quitado (registrado en auth-api,
      # ServiceAuth__Clients__8 mas abajo).
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${TENANT_SERVICE_CLIENT_ID:-tenant-worker}
      ServiceAuthClient__ClientSecret: ${TENANT_SERVICE_CLIENT_SECRET:-}
      CloudStorageClient__BaseUrl: http://cloudstorage-api:8080
      # Fase D1 — credenciales MinIO propias para subir el logo (IAM scoped a
      # taxvision-temp/tenant-branding/*, ver deploy/docker/minio/policies/tenant-source.json
      # + el servicio "minio-provision" de este mismo compose). NUNCA MINIO_ROOT_USER/PASSWORD.
      Tenant__Minio__Endpoint: minio:9000
      Tenant__Minio__UseTls: "false"
      Tenant__Minio__AccessKey: tenant-worker
      Tenant__Minio__SecretKey: ${TENANT_MINIO_SECRET:?Set TENANT_MINIO_SECRET in .env}
      Tenant__Minio__TempBucket: taxvision-temp
      Tenant__Minio__SourcePrefix: tenant-branding
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  auth-api:
    image: taxvision/auth-api:dev
    container_name: taxvision-auth-api
    build:
      context: ../..
      dockerfile: src/Services/Auth/Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${AUTH_DB_CONNECTION:?Set AUTH_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # DEV: aceptar el tenantId del body en /auth/login (sin resolución por Host/subdominio).
      # En prod queda true (appsettings.json). Development ya usa false.
      TenantDomains__EnforceHostResolution: "false"
      # RS256: unico servicio con la clave privada — firma los JWT y publica el
      # JWKS real en /auth/.well-known/jwks.json (con HS256 ese endpoint
      # devuelve un keyset vacio, ver SigningKeyProvider.cs:65-69 — rompe la
      # validacion de Communication, que SOLO valida via JWKS).
      Jwt__PrivateKeyPath: /run/secrets/jwt-private.pem
      # Auth también valida bearer tokens en sus propios endpoints protegidos
      # (/auth/logout, /auth/me, etc.) — necesita la pública igual que el resto
      # de los servicios, no solo la privada para firmar (README §31.4).
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Dominio base para componer subdominios de tenant (oficina1.taxproffice.com).
      # Explicito en vez de confiar en el default de TenantDomainOptions.cs — mismo
      # valor que usa Caddy para el certificado wildcard (TAXVISION_BASE_DOMAIN).
      TenantDomains__BaseDomain: ${TAXVISION_BASE_DOMAIN:-taxproffice.com}
      # Clave de cifrado de secretos de MFA (AesGcmSecretProtector.cs). Antes caia
      # al fallback derivado de Jwt:Secret, pero ese ya no existe con RS256 —
      # sin esta var explicita, el primer uso de MFA tira InvalidOperationException.
      Mfa__EncryptionKey: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env}
      # PayFlow + Gift/Referral — URLs internas que el onboarding pago-primero llama M2M. Los defaults de
      # appsettings son localhost host-mapped (no resuelven container-a-container), así que se fijan acá.
      Auth__Growth__BaseUrl: http://growth-api:8080
      Auth__Subscription__BaseUrl: http://subscription-api:8080
      Auth__PaymentApp__BaseUrl: http://payment-app-api:8080
      Auth__Tenant__BaseUrl: http://tenant-api:8080
      # Loopback de la saga (creación del owner) — debe apuntar al propio auth-api, no a localhost.
      Onboarding__AuthPublicBaseUrl: http://auth-api:8080
      # Cliente de servicio (M2M) para el worker de Notification: emite tokens con permisos de
      # CloudStorage y (Fase 10.5 hardening) scribe.render — ScribeRenderClient reusa este mismo
      # token M2M para llamar POST /scribe/render, gateado por [HasPermission(ScribePermissions.
      # Render)] (mismo mecanismo que los endpoints humanos de Scribe, no ServiceOnly/actor_type).
      # Sin esta linea el claim "perm" nunca incluia scribe.render y la llamada devolvia 403 real —
      # bug real encontrado y corregido en la Fase 10.5, no solo el permiso sin sembrar en Auth.
      ServiceAuth__Clients__0__ClientId: ${NOTIFICATION_SERVICE_CLIENT_ID:-notification-worker}
      ServiceAuth__Clients__0__Secret: ${NOTIFICATION_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__0__Permissions__0: cloudstorage.file.upload
      ServiceAuth__Clients__0__Permissions__1: cloudstorage.file.download
      ServiceAuth__Clients__0__Permissions__2: cloudstorage.file.view
      ServiceAuth__Clients__0__Permissions__3: scribe.render
      # SMS: el worker de Notification (u orquestador de comms) llama POST /sms/messages, gateado
      # por [HasPermission(SmsPermissions.Send)] — el token M2M debe llevar sms.send como claim
      # "perm" (bypass de actor Service en ProjectionPermissionsSource). Mismo patron que scribe.render.
      ServiceAuth__Clients__0__Permissions__4: sms.send
      ServiceAuth__Clients__0__Permissions__5: catalog.read
      ServiceAuth__Clients__0__Permissions__6: catalog.write
      ServiceAuth__Clients__0__Permissions__7: catalog.delete
      ServiceAuth__Clients__0__Permissions__8: inventory.read
      ServiceAuth__Clients__0__Permissions__9: inventory.write
      ServiceAuth__Clients__0__Permissions__10: inventory.adjust
      # Cliente de servicio (M2M) para el worker de Transcripts de Communication (Fase 6):
      # descarga la grabacion, sube el .txt transcrito, mismos permisos de CloudStorage.
      ServiceAuth__Clients__1__ClientId: ${COMMUNICATION_TRANSCRIPT_WORKER_CLIENT_ID:-communication-transcript-worker}
      ServiceAuth__Clients__1__Secret: ${COMMUNICATION_TRANSCRIPT_WORKER_CLIENT_SECRET:-}
      ServiceAuth__Clients__1__Permissions__0: cloudstorage.file.upload
      ServiceAuth__Clients__1__Permissions__1: cloudstorage.file.download
      ServiceAuth__Clients__1__Permissions__2: cloudstorage.file.view
      # Cliente de servicio (M2M) para Signature: descarga el documento pendiente de sellado
      # y sube el PDF sellado/PAdES a CloudStorage (README.md:3352-3362).
      ServiceAuth__Clients__2__ClientId: ${SIGNATURE_SERVICE_CLIENT_ID:-signature-worker}
      ServiceAuth__Clients__2__Secret: ${SIGNATURE_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__2__Permissions__0: cloudstorage.file.download
      ServiceAuth__Clients__2__Permissions__1: cloudstorage.file.view
      ServiceAuth__Clients__2__Permissions__2: cloudstorage.file.upload
      # Cliente de servicio (M2M) para Customer: sube el Excel/CSV de import directo a MinIO
      # con credenciales propias (ver Customer__Minio__* mas abajo) y solo usa este token para
      # descargarlo de vuelta (parseo de filas) y borrarlo al terminar — nunca para subir.
      ServiceAuth__Clients__3__ClientId: ${CUSTOMER_SERVICE_CLIENT_ID:-customer-worker}
      ServiceAuth__Clients__3__Secret: ${CUSTOMER_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__3__Permissions__0: cloudstorage.file.download
      ServiceAuth__Clients__3__Permissions__1: cloudstorage.file.view
      ServiceAuth__Clients__3__Permissions__2: cloudstorage.file.delete
      # Cliente de servicio (M2M) para Correspondence: backfill de CustomerEmailAddresses via
      # Customer.Api GET /customers/internal/list (policy ServiceOnly, sin permiso puntual) y
      # descarga de adjuntos vía CloudStorage GetFileMetadataAsync/download-url (AttachFileToDraftHandler).
      ServiceAuth__Clients__4__ClientId: ${CORRESPONDENCE_SERVICE_CLIENT_ID:-correspondence-worker}
      ServiceAuth__Clients__4__Secret: ${CORRESPONDENCE_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__4__Permissions__0: cloudstorage.file.download
      ServiceAuth__Clients__4__Permissions__1: cloudstorage.file.view
      # Cliente de servicio (M2M) para Scribe: sube/descarga assets de templates/layouts a
      # CloudStorage (publicar plantillas). Nunca borra.
      ServiceAuth__Clients__5__ClientId: ${SCRIBE_SERVICE_CLIENT_ID:-scribe-worker}
      ServiceAuth__Clients__5__Secret: ${SCRIBE_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__5__Permissions__0: cloudstorage.file.upload
      ServiceAuth__Clients__5__Permissions__1: cloudstorage.file.download
      ServiceAuth__Clients__5__Permissions__2: cloudstorage.file.view
      # Cliente de servicio (M2M) para Postmaster: solo lectura contra CloudStorage
      # (descarga adjuntos/documentos), nunca sube.
      ServiceAuth__Clients__6__ClientId: ${POSTMASTER_SERVICE_CLIENT_ID:-postmaster-worker}
      ServiceAuth__Clients__6__Secret: ${POSTMASTER_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__6__Permissions__0: cloudstorage.file.download
      ServiceAuth__Clients__6__Permissions__1: cloudstorage.file.view
      # Cliente de servicio (M2M) para Communication (F8 attach-recording): valida
      # metadata de grabaciones contra CloudStorage. Ya estaba registrado en los
      # user-secrets locales de Auth (Clients:2) pero nunca se copio a este compose
      # — communication-api hubiera fallado con invalid_client en Docker/produccion.
      ServiceAuth__Clients__7__ClientId: ${COMMUNICATION_SERVICE_AUTH_CLIENT_ID:-communication-worker}
      ServiceAuth__Clients__7__Secret: ${COMMUNICATION_SERVICE_AUTH_CLIENT_SECRET:-}
      ServiceAuth__Clients__7__Permissions__0: cloudstorage.file.upload
      ServiceAuth__Clients__7__Permissions__1: cloudstorage.file.download
      ServiceAuth__Clients__7__Permissions__2: cloudstorage.file.view
      # Cliente de servicio (M2M) para Tenant (Tenant_Service_LogoSupport_Plan.md): sube el logo
      # directo a MinIO con credenciales propias (Fase D1, ver Tenant__Minio__* mas abajo) y solo
      # usa este token para pedir el download-url presignado y borrar el logo reemplazado/quitado.
      # Nunca sube via CloudStorage HTTP, por eso sin cloudstorage.file.upload.
      ServiceAuth__Clients__8__ClientId: ${TENANT_SERVICE_CLIENT_ID:-tenant-worker}
      ServiceAuth__Clients__8__Secret: ${TENANT_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__8__Permissions__0: cloudstorage.file.download
      ServiceAuth__Clients__8__Permissions__1: cloudstorage.file.delete
      # Clientes M2M de Payment para el protocolo quote/reserve/commit/cancel.
      # Audience y scopes son obligatorios; Growth no acepta un token genérico de servicios.
      ServiceAuth__Clients__9__ClientId: ${PAYMENTAPP_GROWTH_CLIENT_ID:-payment-app-growth}
      ServiceAuth__Clients__9__Secret: ${PAYMENTAPP_GROWTH_CLIENT_SECRET:-}
      ServiceAuth__Clients__9__Audience: taxvision-growth
      ServiceAuth__Clients__9__Scopes__0: growth.codes.quote
      ServiceAuth__Clients__9__Scopes__1: growth.codes.reserve
      ServiceAuth__Clients__9__Scopes__2: growth.codes.commit
      ServiceAuth__Clients__9__Scopes__3: growth.codes.cancel
      ServiceAuth__Clients__9__Scopes__4: growth.codes.compensate
      ServiceAuth__Clients__9__Scopes__5: growth.referrals.qualify
      ServiceAuth__Clients__10__ClientId: ${PAYMENTCLIENT_GROWTH_CLIENT_ID:-payment-client-growth}
      ServiceAuth__Clients__10__Secret: ${PAYMENTCLIENT_GROWTH_CLIENT_SECRET:-}
      ServiceAuth__Clients__10__Audience: taxvision-growth
      ServiceAuth__Clients__10__Scopes__0: growth.codes.quote
      ServiceAuth__Clients__10__Scopes__1: growth.codes.reserve
      ServiceAuth__Clients__10__Scopes__2: growth.codes.commit
      ServiceAuth__Clients__10__Scopes__3: growth.codes.cancel
      ServiceAuth__Clients__10__Scopes__4: growth.codes.compensate
      ServiceAuth__Clients__11__ClientId: ${SUBSCRIPTION_GROWTH_CLIENT_ID:-subscription-growth}
      ServiceAuth__Clients__11__Secret: ${SUBSCRIPTION_GROWTH_CLIENT_SECRET:-}
      ServiceAuth__Clients__11__Audience: taxvision-growth
      ServiceAuth__Clients__11__Scopes__0: growth.referrals.reward.confirm
      ServiceAuth__Clients__11__Scopes__1: growth.grants.confirm
      ServiceAuth__Clients__11__Scopes__2: growth.codes.reserve-benefit-gift
      # Billing → Documents (M2M): generar el PDF de facturas.
      ServiceAuth__Clients__12__ClientId: ${BILLING_DOCUMENTS_CLIENT_ID:-billing-documents}
      ServiceAuth__Clients__12__Secret: ${BILLING_DOCUMENTS_CLIENT_SECRET:-}
      ServiceAuth__Clients__12__Audience: taxvision-documents
      ServiceAuth__Clients__12__Scopes__0: documents.generate
      # Billing → PaymentClient (M2M): crear el link de cobro de la factura (Fase 2A).
      ServiceAuth__Clients__13__ClientId: ${BILLING_PAYMENTS_CLIENT_ID:-billing-payments}
      ServiceAuth__Clients__13__Secret: ${BILLING_PAYMENTS_CLIENT_SECRET:-}
      ServiceAuth__Clients__13__Audience: taxvision-payments
      ServiceAuth__Clients__13__Scopes__0: payments.links.create
      # PayFlow (Fase 16) — PaymentApp → Subscription (M2M): resolver el precio real del plan antes
      # de crear el Stripe Checkout Session del onboarding. Subscription no valida audience/scopes
      # granulares en este endpoint (solo ServiceOnly + AllowActorTypes(Service)), así que no hace
      # falta Audience/Scopes acá — mismo estilo que los clientes 0-8.
      ServiceAuth__Clients__14__ClientId: ${PAYMENTAPP_SUBSCRIPTION_CLIENT_ID:-payment-app-subscription}
      ServiceAuth__Clients__14__Secret: ${PAYMENTAPP_SUBSCRIPTION_CLIENT_SECRET:-}
      # Auditoria RateLimit hallazgo #2 — 5 acquirers M2M nuevos, uno por servicio que antes
      # solo RECIBIA llamadas M2M, solo para leer el catalogo de PlanRateLimits de
      # Subscription (HttpPlanRateLimitReader). Subscription's ServiceOnly policy solo exige
      # actor_type=Service, sin Audience/Scopes granulares — mismo estilo que el cliente 14.
      ServiceAuth__Clients__15__ClientId: ${CLOUDSTORAGE_SERVICE_CLIENT_ID:-cloudstorage-worker}
      ServiceAuth__Clients__15__Secret: ${CLOUDSTORAGE_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__16__ClientId: ${CONNECTORS_SERVICE_CLIENT_ID:-connectors-worker}
      ServiceAuth__Clients__16__Secret: ${CONNECTORS_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__17__ClientId: ${DOCUMENTS_SERVICE_CLIENT_ID:-documents-worker}
      ServiceAuth__Clients__17__Secret: ${DOCUMENTS_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__18__ClientId: ${GROWTH_SERVICE_CLIENT_ID:-growth-worker}
      ServiceAuth__Clients__18__Secret: ${GROWTH_SERVICE_CLIENT_SECRET:-}
      ServiceAuth__Clients__19__ClientId: ${PAYMENTCLIENT_SERVICE_CLIENT_ID:-paymentclient-worker}
      ServiceAuth__Clients__19__Secret: ${PAYMENTCLIENT_SERVICE_CLIENT_SECRET:-}
      # RateLimit Fase 4 (Notes) — misma identidad notes-worker que Fase 4B (Customer M2M)
      # reutilizará; solo para que HttpPlanRateLimitReader lea el catálogo de Subscription.
      ServiceAuth__Clients__20__ClientId: ${NOTES_SERVICE_CLIENT_ID:-notes-worker}
      ServiceAuth__Clients__20__Secret: ${NOTES_SERVICE_CLIENT_SECRET:-}
      # Billing quedó fuera de la tanda 15-19 porque es el único servicio cuya config M2M es un
      # diccionario multi-cliente (Billing:ServiceClients:Clients:<Nombre>) en vez de un
      # ServiceAuthClient único, así que el barrido por nombre de clave no lo tocó. Sin este
      # cliente, dos cosas fallaban en silencio: el catálogo de plan-rate-limits (cuotas sin
      # escalar por tier) y la recuperación pull de permisos (Billing fail-closed).
      ServiceAuth__Clients__21__ClientId: ${BILLING_PLATFORM_CLIENT_ID:-billing-worker}
      ServiceAuth__Clients__21__Secret: ${BILLING_PLATFORM_CLIENT_SECRET:-}
      # Reminder Fase 4 — sin Permissions ni Scopes a proposito: los dos destinos que consume
      # (internal/plan-rate-limits de Subscription y permissions-snapshot de Auth) exigen solo
      # actor_type=Service via la policy ServiceOnly.
      ServiceAuth__Clients__22__ClientId: ${REMINDER_SERVICE_CLIENT_ID:-reminder-worker}
      ServiceAuth__Clients__22__Secret: ${REMINDER_SERVICE_CLIENT_SECRET:-}
      # Tasks — mismo caso que reminder-worker: sin Permissions ni Scopes porque los dos destinos
      # (internal/plan-rate-limits de Subscription y permissions-snapshot de Auth) solo exigen
      # actor_type=Service via la policy ServiceOnly.
      ServiceAuth__Clients__23__ClientId: ${TASKS_SERVICE_CLIENT_ID:-tasks-worker}
      ServiceAuth__Clients__23__Secret: ${TASKS_SERVICE_CLIENT_SECRET:-}
      # Leer en que acabo el escaneo de un archivo ya adjunto: el veredicto se publica una sola vez
      # y un adjunto creado despues de esa publicacion no vuelve a recibirlo.
      ServiceAuth__Clients__23__Permissions__0: cloudstorage.file.view
      # Calendar — mismo caso que reminder-worker: sin Permissions ni Scopes, porque los dos destinos
      # (internal/plan-rate-limits de Subscription y permissions-snapshot de Auth) solo exigen
      # actor_type=Service via la policy ServiceOnly.
      ServiceAuth__Clients__24__ClientId: ${CALENDAR_SERVICE_CLIENT_ID:-calendar-worker}
      ServiceAuth__Clients__24__Secret: ${CALENDAR_SERVICE_CLIENT_SECRET:-}
      # Bootstrap del primer PlatformAdmin (PlatformAdminBootstrapService.cs) — el token
      # llegaba a .env vía deploy.yml pero nunca se mapeaba acá, asi que no hacia nada.
      # Default Enabled=false a proposito: si esta en true pero Email/InvitationToken
      # faltan o son invalidos, el hosted service tira InvalidOperationException al
      # arrancar y tumba todo auth-api. Activar explicitamente (PLATFORM_BOOTSTRAP_ENABLED=true)
      # solo para el deploy que crea al primer PlatformAdmin, despues se puede dejar
      # en true sin riesgo — el service detecta que ya existe un PlatformAdmin y hace no-op.
      PlatformBootstrap__Enabled: ${PLATFORM_BOOTSTRAP_ENABLED:-false}
      PlatformBootstrap__Email: ${PLATFORM_BOOTSTRAP_EMAIL:-}
      PlatformBootstrap__InvitationToken: ${PLATFORM_BOOTSTRAP_INVITATION_TOKEN:-}
      # Recovery path (PlatformAdminEmergencyAccessService.cs): crea un PlatformAdmin directo
      # (sin invitación) cuando no hay ningún PlatformAdmin operativo para invitar a otro.
      # Mismo riesgo de arranque que PlatformBootstrap arriba si Enabled=true sin los demás
      # campos completos — dejar en false salvo el deploy puntual que necesita el recovery.
      # Idempotente por email: no pisa un usuario ya creado, así que puede quedar en true
      # sin riesgo despues del primer uso exitoso (aunque igual conviene apagarlo).
      PlatformEmergencyAccess__Enabled: ${PLATFORM_EMERGENCY_ENABLED:-false}
      PlatformEmergencyAccess__Email: ${PLATFORM_EMERGENCY_EMAIL:-}
      PlatformEmergencyAccess__Name: ${PLATFORM_EMERGENCY_NAME:-}
      PlatformEmergencyAccess__LastName: ${PLATFORM_EMERGENCY_LASTNAME:-}
      PlatformEmergencyAccess__PasswordHash: ${PLATFORM_EMERGENCY_PASSWORD_HASH:-}
      # Auditoría (gap MinIO/legal-docs) — credenciales MinIO propias de Auth (IAM scoped a
      # taxvision-temp/auth/*, ver deploy/docker/minio/policies/auth-source.json), primer uso de
      # MinIO en Auth: PlatformAdmin sube documentos legales (ToS/Privacy Policy). Mismo patron D0/D1
      # que Documents/Scribe. Endpoint INTERNO (contenedor→MinIO), no el publico.
      Auth__Minio__Endpoint: minio:9000
      Auth__Minio__AccessKey: auth-worker
      Auth__Minio__SecretKey: ${AUTH_MINIO_SECRET:-}
      Auth__Minio__UseTls: ${MINIO_USE_TLS:-false}
      Auth__Minio__TempBucket: taxvision-temp
      Auth__Minio__SourcePrefix: auth
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    # /health/ready ya existe (Program.cs: sql-server + redis + rabbitmq, tag "ready") — solo
    # faltaba exponerlo como HEALTHCHECK de Docker para que otros servicios puedan hacer
    # depends_on: condition: service_healthy sobre auth-api (antes ningún servicio .NET tenía
    # HEALTHCHECK, así que ese condition nunca era una opción real). start_period generoso
    # porque auth-api corre varios hosted services de bootstrap (PlatformAdmin/backfills) antes
    # de aceptar trafico.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  customer-api:
    image: taxvision/customer-api:dev
    container_name: taxvision-customer-api
    build:
      context: ../..
      dockerfile: src/Services/Customer/TaxVision.Customer.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CUSTOMER_DB_CONNECTION:?Set CUSTOMER_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Cifrado AES-256-GCM del tax identifier (SSN/EIN) — AesGcmSensitiveDataProtector lo
      # exige en el arranque de CUALQUIER handler que toque CustomerReadService (incluyendo
      # Search, que solo enmascara, no revela), no únicamente RevealTaxIdentifierHandler.
      # Base64 de 32 bytes; mismo secreto ya usado por Notification/Postmaster/Connectors/
      # Signature/PaymentClient — nunca generar uno nuevo, o los tax identifiers ya cifrados
      # en la base con la clave vieja quedan indescifrables.
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      # Microservicio CloudStorage donde vive el archivo de import mientras se procesa.
      CloudStorageClient__BaseUrl: http://cloudstorage-api:8080
      # Credenciales de servicio (M2M) — solo para DownloadAsync/DeleteAsync del archivo de
      # import (el UploadAsync va directo a MinIO, ver Customer__Minio__* abajo).
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${CUSTOMER_SERVICE_CLIENT_ID:-customer-worker}
      ServiceAuthClient__ClientSecret: ${CUSTOMER_SERVICE_CLIENT_SECRET:-}
      # RateLimit auditoría hallazgo #1 — flag activado default en los 17 servicios (antes solo
      # Customer lo tenía en true opcional, piloto Fase 6). Override sigue disponible por env var.
      RateLimit__EnforceTierQuotas: ${CUSTOMER_ENFORCE_TIER_QUOTAS:-true}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
      # Credenciales MinIO propias para el archivo de import (IAM scoped a
      # taxvision-temp/customer/*, ver deploy/docker/minio/policies/customer-source.json +
      # provision-service-accounts.sh). NUNCA MINIO_ROOT_USER/PASSWORD.
      Customer__Minio__Endpoint: minio:9000
      Customer__Minio__UseTls: "false"
      Customer__Minio__AccessKey: customer-worker
      Customer__Minio__SecretKey: ${CUSTOMER_MINIO_SECRET:?Set CUSTOMER_MINIO_SECRET in .env}
      Customer__Minio__TempBucket: taxvision-temp
      Customer__Minio__SourcePrefix: customer
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # CustomerImportCleanupHostedService llama a cloudstorage-api (borrado del archivo de
      # import) en su primera iteración diaria — mismo tipo de dependencia de arranque que
      # scribe-api, aunque con menor probabilidad de disparar (job diario, no cada boot).
      cloudstorage-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  subscription-api:
    image: taxvision/subscription-api:dev
    container_name: taxvision-subscription-api
    build:
      context: ../..
      dockerfile: src/Services/Subscription/TaxVision.Subscription.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${SUBSCRIPTION_DB_CONNECTION:?Set SUBSCRIPTION_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      Subscriptions__DefaultPlanCode: starter
      Subscriptions__TrialDays: "14"
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Fase 4 Referidos (2026-07-21) — M2M contra Growth para reservar el descuento de
      # bienvenida del referido en la primera activacion. Mismo patron que
      # Correspondence/Signature/Postmaster (ServiceAuthClientOptions + token acquirer).
      Subscription__ServiceAuth__AuthBaseUrl: http://auth-api:8080
      Subscription__ServiceAuth__ClientId: ${SUBSCRIPTION_GROWTH_CLIENT_ID:-subscription-growth}
      Subscription__ServiceAuth__ClientSecret: ${SUBSCRIPTION_GROWTH_CLIENT_SECRET:-}
      Subscription__Growth__BaseUrl: http://growth-api:8080
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  notification-api:
    image: taxvision/notification-api:dev
    container_name: taxvision-notification-api
    build:
      context: ../..
      dockerfile: src/Services/Notification/TaxVision.Notification.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${NOTIFICATION_DB_CONNECTION:?Set NOTIFICATION_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      Portal__BaseUrl: ${PORTAL_BASE_URL:-http://localhost:4200}
      Portal__BaseDomain: ${TAXVISION_BASE_DOMAIN:-taxproffice.com}
      # Hardening Fase 21 (2026-07-18) — default flippeado a true: Postmaster es ahora el único
      # camino de envío real de Notification (Fases 17-20 retiraron/migraron todo lo que competía:
      # módulo de mailbox/sync duplicado, self-service de templates por HTTP, y el transporte SMTP
      # directo de EmailDeliveryService/InProcessEmailDispatchGateway ganó su equivalente
      # event-based). Rollback: setear NOTIFICATION_USE_POSTMASTER_DISPATCH=false en el .env de
      # despliegue — el path in-process/SMTP-directo sigue vivo, sin eliminar (retiro real es
      # trabajo futuro fuera de este plan, condicionado a confianza operacional en producción).
      Notification__UsePostmasterDispatch: ${NOTIFICATION_USE_POSTMASTER_DISPATCH:-true}
      # Fase 7 del plan de notificaciones dinámicas — default false hasta generar el proyecto en
      # Firebase Console (Configuración del proyecto -> Cuentas de servicio -> Generar nueva clave
      # privada) y decodificar FIREBASE_SERVICE_ACCOUNT_JSON_B64 en TAXVISION_SECRETS_DIR (ver
      # README §Push notifications). El path solo se lee si el flag está en true — FcmPushSender
      # nunca se registra en false, así que un JSON ausente/vacío no rompe el arranque.
      Notification__UseFcmPush: ${NOTIFICATION_USE_FCM_PUSH:-false}
      Notification__Push__Fcm__ServiceAccountJsonPath: /run/secrets/firebase-service-account.json
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-no-reply@taxvision.local}
      # Clave de cifrado de secretos del módulo email (config SMTP/API).
      # Base64 de 32 bytes; requerida para los endpoints de configuración de correo.
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      # Microservicio CloudStorage donde se guardan HTML/design/preview de plantillas y layouts
      # (contexto de request, JWT del usuario/M2M).
      CloudStorageClient__BaseUrl: http://cloudstorage-api:8080
      # Microservicio Scribe — IScribeRenderClient le pega a esto para renderizar plantillas
      # (path de dispatch basado en render). Sin esta linea, ScribeRenderClient no tiene forma
      # de alcanzar scribe-api dentro de docker y el render en vivo falla.
      ScribeClient__BaseUrl: http://scribe-api:8080
      # Credenciales de servicio (M2M) para el CloudStorageClient de arriba (plantillas/layouts).
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${NOTIFICATION_SERVICE_CLIENT_ID:-notification-worker}
      ServiceAuthClient__ClientSecret: ${NOTIFICATION_SERVICE_CLIENT_SECRET:-}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      # Igual que jwt-public.pem/signature-sealing.pfx: el archivo debe existir en
      # TAXVISION_SECRETS_DIR (aunque sea un placeholder vacío) para que el mount no falle,
      # incluso con Notification__UseFcmPush=false — el contenido solo se lee cuando el flag
      # está en true.
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  postmaster-api:
    image: taxvision/postmaster-api:dev
    container_name: taxvision-postmaster-api
    build:
      context: ../..
      dockerfile: src/Services/Postmaster/TaxVision.Postmaster.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${POSTMASTER_DB_CONNECTION:?Set POSTMASTER_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Clave de cifrado de secretos (SMTP password de TenantEmailProvider, ver Fase 3.5).
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Credenciales de servicio (M2M) contra Auth — mismo patron que Correspondence__ServiceAuth.
      Postmaster__ServiceAuth__AuthBaseUrl: http://auth-api:8080
      Postmaster__ServiceAuth__ClientId: ${POSTMASTER_SERVICE_CLIENT_ID:-postmaster-worker}
      Postmaster__ServiceAuth__ClientSecret: ${POSTMASTER_SERVICE_CLIENT_SECRET:?Set POSTMASTER_SERVICE_CLIENT_SECRET in .env}
      # Descarga de adjuntos/documentos desde CloudStorage (solo lectura, nunca sube).
      Postmaster__CloudStorage__BaseUrl: http://cloudstorage-api:8080
      # Canal de envío #3 (TenantOAuth, D3) — M2M a Connectors para enviar vía Gmail/Graph conectado.
      Postmaster__Connectors__BaseUrl: http://connectors-api:8080
      # Proveedor SMTP real de plataforma (SystemEmailProviderSeeder.cs) — reconcilia la fila
      # "smtp-default" en cada boot si SYSTEM_EMAIL_HOST viene seteado, sin pasar por el endpoint
      # admin (util cuando no hay acceso PlatformAdmin). Vacio = queda el placeholder de siempre,
      # no rompe nada. El password viaja cifrado a la base via Encryption__MasterKey de arriba.
      SystemEmailProvider__Host: ${SYSTEM_EMAIL_HOST:-}
      SystemEmailProvider__Port: ${SYSTEM_EMAIL_PORT:-587}
      SystemEmailProvider__UseTls: ${SYSTEM_EMAIL_USE_TLS:-true}
      SystemEmailProvider__Username: ${SYSTEM_EMAIL_USERNAME:-}
      SystemEmailProvider__Password: ${SYSTEM_EMAIL_PASSWORD:-}
      SystemEmailProvider__FromAddressDefault: ${SYSTEM_EMAIL_FROM_ADDRESS:-}
      SystemEmailProvider__FromDisplayNameDefault: ${SYSTEM_EMAIL_FROM_NAME:-}
      SystemEmailProvider__DisplayName: ${SYSTEM_EMAIL_DISPLAY_NAME:-}
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  scribe-api:
    image: taxvision/scribe-api:dev
    container_name: taxvision-scribe-api
    build:
      context: ../..
      dockerfile: src/Services/Scribe/TaxVision.Scribe.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${SCRIBE_DB_CONNECTION:?Set SCRIBE_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Credenciales de servicio (M2M) contra Auth — mismo patron que Correspondence__ServiceAuth.
      Scribe__ServiceAuth__AuthBaseUrl: http://auth-api:8080
      Scribe__ServiceAuth__ClientId: ${SCRIBE_SERVICE_CLIENT_ID:-scribe-worker}
      Scribe__ServiceAuth__ClientSecret: ${SCRIBE_SERVICE_CLIENT_SECRET:?Set SCRIBE_SERVICE_CLIENT_SECRET in .env}
      Scribe__CloudStorage__BaseUrl: http://cloudstorage-api:8080
      # Credenciales MinIO propias (IAM scoped a taxvision-temp/scribe/*, ver
      # deploy/docker/minio/policies/scribe-source.json + provision-service-accounts.sh).
      # NUNCA MINIO_ROOT_USER/PASSWORD. AddSingleton<IMinioClient> es incondicional —
      # sin esto, publicar templates/layouts revienta en Docker.
      Scribe__Minio__Endpoint: minio:9000
      Scribe__Minio__UseTls: "false"
      Scribe__Minio__AccessKey: scribe-worker
      Scribe__Minio__SecretKey: ${SCRIBE_MINIO_SECRET:?Set SCRIBE_MINIO_SECRET in .env}
      Scribe__Minio__TempBucket: taxvision-temp
      Scribe__Minio__SourcePrefix: scribe
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Bug real de producción (2026-07-21): ScribeBaseLayoutSeeder/ScribeNotificationTemplateSeeder/
      # ScribeSystemAssetSeeder/TemplateWarmupService piden un token M2M a auth-api y templates a
      # cloudstorage-api al arrancar. Sin este depends_on, scribe-api podía ganarle la carrera a
      # auth-api (contenedor arriba pero su ASP.NET Core todavía no escuchando en :8080) — logs
      # reales mostraron 13/13 "Connection refused (auth-api:8080)" y "Scribe cache warm-up:
      # 0/13 published template versions loaded". El código ya se arregló (TemplateWarmupService
      # ahora difiere a ApplicationStarted + ServiceTokenAcquirer reintenta), esto cierra la causa
      # raíz de infraestructura para que ninguna de las dos capas tenga que cubrir a la otra sola.
      auth-api:
        condition: service_healthy
      cloudstorage-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  connectors-api:
    image: taxvision/connectors-api:dev
    container_name: taxvision-connectors-api
    build:
      context: ../..
      dockerfile: src/Services/Connectors/TaxVision.Connectors.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CONNECTORS_DB_CONNECTION:?Set CONNECTORS_DB_CONNECTION in .env}
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Cifra los tokens OAuth (Connectors Fase 3). Mismo valor que Notification/Postmaster/Signature
      # — necesario para migrar en el futuro las OAuthConnection existentes de Notification sin
      # re-encriptar (ver Connectors_Service_Design_And_Implementation_Plan.md §33 RM1).
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      # Lock distribuido para el refresh proactivo de OAuth (Fase 4) — mismo Redis que Signature/Subscription.
      ConnectionStrings__Redis: redis:6379
      # App registration compartido de TaxVision (uno por proveedor, no por tenant). Vars ya
      # reservadas en .env desde el plan de deploy original (GMAIL_*/MSGRAPH_*), nunca usadas hasta ahora.
      Connectors__OAuth__Google__ClientId: ${GMAIL_CLIENT_ID:-}
      Connectors__OAuth__Google__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Connectors__OAuth__Microsoft__ClientId: ${MSGRAPH_CLIENT_ID:-}
      Connectors__OAuth__Microsoft__ClientSecret: ${MSGRAPH_CLIENT_SECRET:-}
      Connectors__OAuth__Microsoft__TenantId: ${MSGRAPH_TENANT_ID:-common}
      # Flujo de conectar cuenta (D3 §12.2/12.4) — debe matchear byte a byte el redirect_uri
      # configurado en el app registration de cada proveedor.
      Connectors__OAuth__Google__RedirectUri: ${CONNECTORS_GOOGLE_REDIRECT_URI:-http://localhost:5047/connectors/oauth/callback/gmail}
      Connectors__OAuth__Microsoft__RedirectUri: ${CONNECTORS_MICROSOFT_REDIRECT_URI:-http://localhost:5047/connectors/oauth/callback/graph}
      # A dónde redirige el navegador tras el callback de OAuth (D3 §12.4/12.5) — mismo frontend que Notification.
      Portal__BaseUrl: ${PORTAL_BASE_URL:-http://localhost:4200}
      # Watch/subscription renewal (Fase 6) — topic de Pub/Sub (Gmail) y notificationUrl+clientState
      # (Graph). Sin esto SetupWatchHandler falla al conectar una cuenta Gmail/Graph.
      Connectors__Watch__Gmail__TopicName: ${CONNECTORS_GMAIL_WATCH_TOPIC:-}
      Connectors__Watch__Graph__NotificationUrl: ${CONNECTORS_GRAPH_NOTIFICATION_URL:-}
      Connectors__Watch__Graph__ClientState: ${CONNECTORS_GRAPH_WATCH_CLIENT_STATE:-}
      # Webhooks públicos (Fase 7) — audiencia esperada del JWT OIDC de Pub/Sub.
      Connectors__Webhooks__GmailPush__ExpectedAudience: ${CONNECTORS_GMAIL_PUSH_AUDIENCE:-}
      # Reconciliación (README §37.8) — safety net Gmail/Graph detrás del push, único mecanismo de
      # sync de IMAP. Default 15 min: prioriza que IMAP (100% dependiente de este job) tenga
      # frescura razonable sin volver a un polling agresivo por-mailbox.
      Connectors__Reconciliation__IntervalMinutes: ${CONNECTORS_RECONCILIATION_INTERVAL_MINUTES:-15}
      # Auditoria RateLimit hallazgo #2 — acquirer M2M nuevo, solo para leer el catalogo de
      # PlanRateLimits de Subscription (HttpPlanRateLimitReader).
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${CONNECTORS_SERVICE_CLIENT_ID:-connectors-worker}
      ServiceAuthClient__ClientSecret: ${CONNECTORS_SERVICE_CLIENT_SECRET:-}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  correspondence-api:
