      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      Jwt__ValidAudiences__0: TaxVision.Services
      Jwt__ValidAudiences__1: taxvision-growth
      # DEV/E2E — desactiva el tiered rate-limit (la categoría growth.j.codes_quote declara OverlayLayers
      # vacío y el TieredRateLimitEvaluator la rechaza; gap de config preexistente del catálogo).
      RateLimit__EnforceTierQuotas: "false"
