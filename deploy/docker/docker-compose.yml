  billing-api:
    image: taxvision/billing-api:dev
    container_name: taxvision-billing-api
    build:
      context: ../..
      dockerfile: src/Services/Billing/TaxVision.Billing.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${BILLING_DB_CONNECTION:?Set BILLING_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      Jwt__ValidAudiences__0: TaxVision.Services
      Jwt__ValidAudiences__1: taxvision-billing
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Tokens M2M: un solo proveedor, credenciales por cliente nombrado (punto 10 del review).
      Billing__ServiceClients__AuthBaseUrl: http://auth-api:8080
      # Platform = audiencia amplia TaxVision.Services. Lo consumen el snapshot de permisos de Auth
      # (recuperación pull) y el catálogo de plan-rate-limits de Subscription; los dos endpoints solo
      # exigen ServiceOnly + ActorType.Service. Documents/Payments NO sirven ahí: se emiten con
      # audiencia acotada al destino y el receptor los rechaza con 401.
      Billing__ServiceClients__Clients__Platform__ClientId: ${BILLING_PLATFORM_CLIENT_ID:-billing-worker}
      Billing__ServiceClients__Clients__Platform__ClientSecret: ${BILLING_PLATFORM_CLIENT_SECRET:-}
      Billing__ServiceClients__Clients__Documents__ClientId: ${BILLING_DOCUMENTS_CLIENT_ID:-billing-documents}
      Billing__ServiceClients__Clients__Documents__ClientSecret: ${BILLING_DOCUMENTS_CLIENT_SECRET:-}
      Billing__ServiceClients__Clients__Payments__ClientId: ${BILLING_PAYMENTS_CLIENT_ID:-billing-payments}
      Billing__ServiceClients__Clients__Payments__ClientSecret: ${BILLING_PAYMENTS_CLIENT_SECRET:-}
      # Bases de los servicios destino (prod docker; en dev Documents corre en el host → override por .env).
      Billing__Documents__BaseUrl: ${BILLING_DOCUMENTS_BASE_URL:-http://documents-api:8080}
      Billing__PaymentClient__BaseUrl: ${BILLING_PAYMENTCLIENT_BASE_URL:-http://payment-client-api:8080}
      # Cuotas por tier: HttpPlanRateLimitReader va contra este host. Sin esto caía al default
      # localhost:5360 del binding, que dentro del contenedor no resuelve a nada.
      SubscriptionClient__BaseUrl: http://subscription-api:8080
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
