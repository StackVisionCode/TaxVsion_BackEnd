  payment-client-api:
    image: taxvision/payment-client-api:dev
    container_name: taxvision-payment-client-api
    build:
      context: ../..
      dockerfile: src/Services/PaymentClient/TaxVision.PaymentClient.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${PAYMENTCLIENT_DB_CONNECTION:?Set PAYMENTCLIENT_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Acepta el token M2M scoped de Billing (audience taxvision-payments) además del genérico —
      # habilita internal/payables (Fase 2A). Mismo patrón que documents-api.
      Jwt__ValidAudiences__0: TaxVision.Services
      Jwt__ValidAudiences__1: taxvision-payments
      # Base pública con la que PaymentClient compone la URL ESTABLE de facturas (la del PDF). Dev = gateway.
      PaymentClient__Public__BaseUrl: ${PAYMENTCLIENT_PUBLIC_BASE_URL:-http://localhost:5047}
      # RBAC Fase 7: enforza permisos contra la proyección local (poblada por eventos de Auth) en vez de
      # leer perms embebidos en el JWT — los tokens self-service vienen sin perms. Habilita los endpoints
      # humanos de config de pago (settings 2B). Mismo modo que documents-api.
      Authorization__PermissionsSource: Projection
      # Modo DirectApiKeys: cada tenant trae sus propias credenciales Stripe
      # (TenantPaymentConfig) cifradas con esta clave.
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      # Modo Connect: una sola cuenta Stripe (la de la plataforma) crea Connected
      # Accounts y cobra direct charges en nombre del tenant — a diferencia de
      # DirectApiKeys, esto sí es una credencial global, análoga a Stripe__SecretKey
      # en payment-app-api.
      Stripe__PlatformSecretKey: ${STRIPE_CONNECT_PLATFORM_SECRET_KEY:-}
      Stripe__ConnectWebhookSecret: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Auditoria RateLimit hallazgo #2 — primer acquirer M2M saliente de PaymentClient (antes solo
      # RECIBIA llamadas M2M), solo para leer el catalogo de PlanRateLimits de Subscription.
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${PAYMENTCLIENT_SERVICE_CLIENT_ID:-paymentclient-worker}
      ServiceAuthClient__ClientSecret: ${PAYMENTCLIENT_SERVICE_CLIENT_SECRET:-}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  growth-api:
    image: taxvision/growth-api:dev
