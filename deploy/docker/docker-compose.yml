  cloudstorage-api:
    image: taxvision/cloudstorage-api:dev
    container_name: taxvision-cloudstorage-api
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: src/Services/CloudStorage/TaxVision.CloudStorage.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CLOUDSTORAGE_DB_CONNECTION:?Set CLOUDSTORAGE_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Endpoint INTERNO (red de Docker) — todas las operaciones reales: bootstrap de
      # buckets, upload/download/copy/delete server-side, multipart initiate/complete/
      # abort. Nunca depende de Caddy/DNS/TLS, así que MinioBucketBootstrapper no puede
      # quedar bloqueado por un certificado o DNS público que todavía no propagó en un
      # deploy fresco (ver postmortem: NullReferenceException en el SDK de MinIO cuando
      # este bootstrapper intentaba resolver el dominio público antes de que Caddy
      # estuviera listo).
      Minio__Endpoint: minio:9000
      Minio__UseTls: "false"
      Minio__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      # Endpoint PUBLICO — usado ÚNICAMENTE para generar URLs presignadas (upload
      # policy, GET, partes de multipart) que el navegador del cliente debe poder
      # alcanzar directo, sin pasar por esta API. Caddy rutea los 3 prefijos de bucket
      # (taxvision-storage/temp/quarantine) de ese dominio hacia minio:9000
      # internamente (ver deploy/docker/caddy/Caddyfile) — MinIO en si nunca se expone
      # directo. Default "true" para producción (Caddy termina TLS ahí). En dev local
      # sin Caddy/dominio real, dejar sin configurar: cae al endpoint interno de arriba.
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-api.taxproffice.com}
      Minio__PublicUseTls: ${MINIO_USE_TLS:-true}
      ClamAv__Host: clamav
      ClamAv__Port: "3310"
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      # Auditoria RateLimit hallazgo #2 — primer acquirer M2M saliente de CloudStorage (antes
      # solo RECIBIA llamadas M2M), solo para leer el catalogo de PlanRateLimits de Subscription.
      ServiceAuthClient__AuthBaseUrl: http://auth-api:8080
      ServiceAuthClient__ClientId: ${CLOUDSTORAGE_SERVICE_CLIENT_ID:-cloudstorage-worker}
      ServiceAuthClient__ClientSecret: ${CLOUDSTORAGE_SERVICE_CLIENT_SECRET:-}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    # /health/ready incluye un chequeo TCP a Minio__Endpoint (sql-server + rabbitmq + minio +
    # clamav, tag "ready") — ahora ese endpoint es SIEMPRE el interno (minio:9000), así que
    # este healthcheck ya no depende de que Caddy/DNS/TLS estén listos.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  signature-api:
    image: taxvision/signature-api:dev
    container_name: taxvision-signature-api
    build:
      context: ../..
      dockerfile: src/Services/Signature/TaxVision.Signature.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${SIGNATURE_DB_CONNECTION:?Set SIGNATURE_DB_CONNECTION in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Uri: ${RABBITMQ_CONNECTION:?Set RABBITMQ_CONNECTION in .env}
      # RS256: la clave publica alcanza para validar — la privada vive solo en auth-api.
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__Issuer: TaxVision.Auth
      Jwt__Audience: TaxVision.Services
      # Clave de cifrado de secretos compartida (BuildingBlocks.Infrastructure.Security) —
      # usada para el audit trail append-only (ConsentEvent) y otros campos sensibles.
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:-}
      Signature__ServiceAuth__AuthBaseUrl: http://auth-api:8080
      Signature__ServiceAuth__ClientId: ${SIGNATURE_SERVICE_CLIENT_ID:-signature-worker}
      Signature__ServiceAuth__ClientSecret: ${SIGNATURE_SERVICE_CLIENT_SECRET:-}
      Signature__CloudStorage__BaseUrl: http://cloudstorage-api:8080
      # Job de reconciliación de CustomerEmailProjection (self-healing, cross-tenant M2M contra
      # customers/internal/reconciliation con token de PlatformTenant). Reutiliza el MISMO
      # signature-worker de arriba; solo necesita la base URL interna de Customer.Api — sin esto
      # el CustomerClientOptions caía al default de dev (localhost:5263), inalcanzable dentro de
      # la red de contenedores, y el barrido de 12h moría en silencio (el cliente nunca lanza).
      Signature__Customer__BaseUrl: http://customer-api:8080
      # Fase D1 — credenciales MinIO propias para subir PDFs sellados (IAM scoped a
      # taxvision-temp/signature/*, ver deploy/docker/minio/policies/signature-source.json
      # + el servicio "minio-provision" de este mismo compose). NUNCA MINIO_ROOT_USER/PASSWORD.
      Signature__Minio__Endpoint: minio:9000
      Signature__Minio__UseTls: "false"
      Signature__Minio__AccessKey: signature-worker
      Signature__Minio__SecretKey: ${SIGNATURE_MINIO_SECRET:?Set SIGNATURE_MINIO_SECRET in .env}
      Signature__Minio__TempBucket: taxvision-temp
      Signature__Minio__SourcePrefix: signature
      # Certificado PAdES-B (CMS signing) montado desde /run/secrets — ver seccion 4 del plan
      # de deploy. Sin CertificatePath configurado, el registro del CMS signer queda inerte
      # (no crashea, pero el sellado no funciona) — ver DependencyInjection.cs linea 73-83.
      Signature__Sealing__Cms__CertificatePath: /run/secrets/signature-sealing.pfx
      Signature__Sealing__Cms__CertificatePassword: ${SIGNATURE_PFX_PASSWORD:?Set SIGNATURE_PFX_PASSWORD in .env}
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
      - taxvision-logs:/app/Logs
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ${TAXVISION_SECRETS_DIR:-/opt/taxvision/secrets}/signature-sealing.pfx:/run/secrets/signature-sealing.pfx:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - taxvision-network

  payment-app-api:
    image: taxvision/payment-app-api:dev
    container_name: taxvision-payment-app-api
    build:
      context: ../..
      dockerfile: src/Services/PaymentApp/TaxVision.PaymentApp.Api/Dockerfile
    expose:
