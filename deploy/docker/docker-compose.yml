      ServiceAuthClient__ClientSecret: ${NOTES_SERVICE_CLIENT_SECRET:-}
      SubscriptionClient__BaseUrl: http://subscription-api:8080
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    volumes:
