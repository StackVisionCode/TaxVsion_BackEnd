services:
  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: taxvision-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    # 5672 (AMQP) solo loopback: los servicios de la app usan rabbitmq:5672 por DNS
    # interno de Docker; fuera del server nadie lo necesita.
    # 15672 (management UI) se bindea a MGMT_BIND_IP (IP de la VPN, desde .env) para
    # verla estando en la VPN. Default 127.0.0.1: si falta la var cae a loopback, nunca 0.0.0.0.
    ports:
      - "127.0.0.1:5672:5672"
      - "${MGMT_BIND_IP:-127.0.0.1}:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - taxvision-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.12-alpine
    container_name: taxvision-redis
    command: ["redis-server", "--appendonly", "yes"]
    # Solo loopback — para redis-cli via VPN+SSH, ningun servicio de la app lo
    # necesita publicado (usan redis:6379 por DNS interno).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - taxvision-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO open source (AGPL-3.0), no el producto comercial AIStor: no requiere licencia.
  # Solo para desarrollo/local. En produccion, apunte cloudstorage-api a un S3 gestionado
  # (S3/R2) via las variables Minio__* (ver README seccion 27.5) para evitar la AGPL.
  # Fuente MinIO: https://github.com/minio/minio
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: taxvision-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    # 9000 (API S3) solo loopback: los servicios .NET/Node corridos con `dotnet run`/
    # `npm run dev` en el host (no en Docker) necesitan pegarle a localhost:9000 —
    # sin esto ningun servicio local (ni siquiera CloudStorage) puede alcanzar MinIO.
    # En produccion Caddy le pega a minio:9000 por la red interna de docker (no usa
    # este mapeo), asi que loopback-only no afloja nada ahi.
    # 9001 (consola) se bindea a MGMT_BIND_IP (IP de la VPN, desde .env). Default 127.0.0.1
    # si falta la var: cae a loopback, nunca 0.0.0.0.
    ports:
      - "127.0.0.1:9000:9000"
      - "${MGMT_BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - /srv/minio:/data
    networks:
      - taxvision-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.3
    container_name: taxvision-clamav
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - taxvision-network
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # SQL Server 2022 Developer edition — gratis para no-produccion-comercial-interna
  # (uso propio del negocio, sin redistribuir), version completa sin los limites de
  # Express. En local usa loopback; produccion lo enlaza exclusivamente a la IP
  # privada anunciada por Cloudflare WARP, nunca a 0.0.0.0 ni a la IP publica.
  # La base ya no vive aca: SQL Server corre en su propio servidor Ubuntu. Este contenedor no la
  # reemplaza, solo espera a que responda antes de arrancar el resto — que es la garantia que daba el
  # `depends_on: sqlserver: service_healthy` de cuando era local. Sin algo asi, y como los servicios
  # migran al arrancar, un despliegue con la base un segundo inalcanzable deja los contenedores
  # muertos: ninguno declara `restart`.
  #
  # Comprueba el puerto, no la sesion: no necesita credenciales y no hay password que montar.
  db-ready:
    image: busybox:1.37
    container_name: taxvision-db-ready
    command:
      - sh
      - -c
      - |
        echo "Esperando a SQL Server en $$SQLSERVER_HOST:$$SQLSERVER_PORT..."
        for i in $$(seq 1 60); do
          nc -z "$$SQLSERVER_HOST" "$$SQLSERVER_PORT" && echo "SQL Server responde." && exit 0
          sleep 2
        done
        echo "SQL Server no respondio en 120s: $$SQLSERVER_HOST:$$SQLSERVER_PORT" >&2
        exit 1
    environment:
      SQLSERVER_HOST: ${SQLSERVER_HOST:?Set SQLSERVER_HOST in .env}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
    networks:
      - taxvision-network

  # --- Observabilidad detenida para liberar RAM/CPU. Reactivar: descomentar estos
  # bloques + el depends_on del otel-collector. Los volumenes de datos se conservan. ---
  # loki:
  #   image: grafana/loki:3.7.2
  #   container_name: taxvision-loki
  #   command: ["-config.file=/etc/loki/loki.yml"]
  #   volumes:
  #     - ../observability/loki.yml:/etc/loki/loki.yml:ro
  #     - loki-data:/loki
  #   expose:
  #     - "3100"
  #   networks:
  #     - taxvision-network

  # tempo:
  #   image: grafana/tempo:2.8.2
  #   container_name: taxvision-tempo
  #   command: ["-config.file=/etc/tempo/tempo.yml"]
  #   volumes:
  #     - ../observability/tempo.yml:/etc/tempo/tempo.yml:ro
  #     - tempo-data:/var/tempo
  #   expose:
  #     - "3200"
