# Local development: keep the application stack without services that require
# Cloudflare DNS, Stripe credentials, or a signing certificate.
services:
  # The legacy minio/minio and minio/mc images are no longer pullable.
  # Pin the maintained, MinIO-compatible community fork for local development.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

  minio-provision:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z

  # En local se entra por localhost, que no resuelve a un tenant por Host: sin este override
  # /auth/login responde 404 (EnforceHostResolution=true es el default de appsettings.json).
  auth-api:
    environment:
      TenantDomains__EnforceHostResolution: "false"
      # Atajo SOLO local: el OTP del correo del alta en el landing es siempre 000000 (el SMTP local es de prueba).
      # Auth se niega a arrancar con esto si EnforceHostResolution=true. Quitar para probar el envío real.
      Onboarding__DevFixedOtpCode: "000000"
      # Tras pagar, el comprador vuelve a {RegistrationUrlBase}/register?token=…: en local es el landing, no el dominio real.
      Onboarding__RegistrationUrlBase: ${LOCAL_LANDING_URL:-http://localhost:4201}

  # Códigos de regalo de demo para probar el alta en el landing (WELCOME100, WELCOME20, GIFTCARD5, GIFTCARD25).
  # En producción NO se siembran: las giftcards las crea el PlatformAdmin.
  growth-api:
    environment:
      Growth__Seeding__OnboardingDemoCodes: "true"
      Giftcards__RedeemBaseUrl: ${LOCAL_LANDING_URL:-http://localhost:4201}

  caddy:
    profiles: [external]

  payment-app-api:
    profiles: [external]

  signature-api:
    profiles: [external]

  gateway:
    depends_on: !override
      - auth-api
      - tenant-api
      - customer-api
      - subscription-api
      - notification-api
      - postmaster-api
      - scribe-api
      - connectors-api
      - correspondence-api
      - cloudstorage-api
      - communication-api
      - payment-client-api
      - growth-api
      - billing-api
      - documents-api
      - notes-api
      - sms-api
      - reminder-api
      - tasks-api
      - calendar-api
      - catalog-api
      - campaigns-api
      - wallet-api
      - inventory-api
      - otel-collector
