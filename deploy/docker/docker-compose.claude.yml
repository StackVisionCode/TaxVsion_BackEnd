# Infraestructura mínima para desarrollo y tests de integración.
#
# NO es el compose de producción (ese es docker-compose.yml, con 47 servicios y SQL Server externo).
# Este solo levanta las cuatro dependencias que los servicios necesitan para arrancar y para que
# corran los tests de integración, con credenciales DE EJEMPLO.
#
#   docker compose -f docker-compose.claude.yml up -d
#
# Cambia las contraseñas si vas a exponer algún puerto fuera de localhost. Tal como está, todo se
# publica solo en 127.0.0.1.

name: taxvision-claude

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taxvision-claude-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - claude-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: taxvision-claude-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.12-alpine
    container_name: taxvision-claude-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: taxvision-claude-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - claude-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  claude-sqlserver:
  claude-minio:
