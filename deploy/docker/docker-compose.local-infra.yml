services:

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: taxvision-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - taxvision-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7.2.12-alpine
    container_name: taxvision-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - taxvision-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: taxvision-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio-data:/data

    networks:
      - taxvision-network

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10


  clamav:
    image: clamav/clamav:1.4.3
    container_name: taxvision-clamav

    ports:
      - "127.0.0.1:3310:3310"

    volumes:
      - clamav-data:/var/lib/clamav

    networks:
      - taxvision-network

    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s


  # T-20: moderación de contenido (imágenes y videos). Lo llama CloudStorage local en
  # http://localhost:5540 con la misma clave (user-secrets ContentScanner:ApiKey).
  # El modelo va dentro de la imagen: se descarga y verifica por SHA-256 en el build.
  content-scanner:
    build:
      context: ../..
      dockerfile: src/Services/ContentScanner/Dockerfile
    image: taxvision/content-scanner:local
    container_name: taxvision-content-scanner

    environment:
      ContentScanner__ApiKey: ${CONTENT_SCANNER_API_KEY:?Set CONTENT_SCANNER_API_KEY in .env}

    ports:
      - "127.0.0.1:5540:8080"

    mem_limit: 768m
    cpus: 1.0

    networks:
      - taxvision-network

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  rabbitmq-data:
  redis-data:
  minio-data:
  clamav-data:


networks:
  taxvision-network:
    name: taxvision-network
