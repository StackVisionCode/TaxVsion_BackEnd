<text x="976.0" y="342.0" font-size="14" font-weight="700" fill="#7B4BA8" text-anchor="start">TenantEntitlementsChangedIntegrationEvent → taxvision-events</text>
<text x="976.0" y="362.0" font-size="13" fill="#1F2328" text-anchor="start">RevisionNumber · PlanCode · SubscriptionStatus · asientos ·</text>
<text x="976.0" y="380.0" font-size="13" fill="#1F2328" text-anchor="start">EntitlementValues (snapshot completo)</text>
<path d="M 1412.0 272.0 L 1412.0 316.0" fill="none" stroke="#444B55" stroke-width="1.7" marker-end="url(#arr-dark)"/>
<rect x="800" y="430" width="770" height="290" rx="10" ry="10" fill="#E9F5EC" fill-opacity="0.55" stroke="#2E7D4F" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="812" y="452" font-size="14" font-weight="700" fill="#2E7D4F">Servicio consumidor (p. ej. FinancialInsights)</text>
<rect x="820" y="470" width="730" height="96" rx="8" ry="8" fill="#F6EFE6" stroke="#8A5A2B" stroke-width="1.6"/>
<text x="830.0" y="496.0" font-size="14" font-weight="700" fill="#8A5A2B" text-anchor="start">Proyección de entitlements en cada servicio</text>
<text x="830.0" y="516.0" font-size="13" fill="#1F2328" text-anchor="start">ApplyIfNewer por RevisionNumber · invalida la caché de plan del tenant</text>
<text x="830.0" y="534.0" font-size="13" fill="#1F2328" text-anchor="start">evt.ExtractEnabledModules() → módulos habilitados de la oficina</text>
<text x="830.0" y="552.0" font-size="13" fill="#1F2328" text-anchor="start">FinancialInsights además lee su cuota (financial.documents_per_month)</text>
<rect x="820" y="600" width="730" height="96" rx="8" ry="8" fill="#FFF8D6" stroke="#9A7B00" stroke-width="1.6"/>
<text x="830.0" y="626.0" font-size="14" font-weight="700" fill="#9A7B00" text-anchor="start">Gate de módulo · AddModuleGate(configuration)</text>
<text x="830.0" y="646.0" font-size="13" fill="#1F2328" text-anchor="start">Authorization:ModuleGate:Enforce + EnforcedModules (valida los nombres)</text>
<text x="830.0" y="664.0" font-size="13" fill="#1F2328" text-anchor="start">Sin fila (null) → pasa · lista vacía [] → 403 Authz.ModuleUnavailable</text>
<text x="830.0" y="682.0" font-size="13" fill="#1F2328" text-anchor="start">PlatformAdmin y Service siempre habilitados</text>
