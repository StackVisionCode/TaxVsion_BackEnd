<rect x="0" y="0" width="1600" height="1110" fill="#FFFFFF"/>
<text x="30" y="40" font-size="24" font-weight="700" fill="#1F2328">Comercialización: de módulo a navegación del CRM</text>
<text x="30" y="66" font-size="14" fill="#555B63">Subscription es dueño del catálogo y de los entitlements; cada servicio proyecta y aplica el gate; Auth da los permisos; el CRM decide qué mostrar</text>
<rect x="30" y="100" width="1540" height="190" rx="10" ry="10" fill="#E9F5EC" fill-opacity="0.55" stroke="#2E7D4F" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="42" y="122" font-size="14" font-weight="700" fill="#2E7D4F">Subscription · dueño del catálogo (Modules, planes, add-ons, revisiones, entitlements)</text>
<rect x="48" y="140" width="280" height="132" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="58.0" y="166.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">Módulo comercial</text>
<text x="58.0" y="186.0" font-size="13" fill="#1F2328" text-anchor="start">Tabla Modules</text>
<text x="58.0" y="204.0" font-size="13" fill="#1F2328" text-anchor="start">Core o Commercial</text>
<text x="58.0" y="222.0" font-size="13" fill="#1F2328" text-anchor="start">Add-on si Commercial y precios &gt; 0</text>
<text x="58.0" y="240.0" font-size="13" fill="#1F2328" text-anchor="start">Ej.: email, meetings, campaigns,</text>
<text x="58.0" y="258.0" font-size="13" fill="#1F2328" text-anchor="start">financial_insights ($29 / $290)</text>
<rect x="354" y="140" width="280" height="132" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="364.0" y="166.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">Plan y edición</text>
<text x="364.0" y="186.0" font-size="13" fill="#1F2328" text-anchor="start">SubscriptionPlan: starter, pro,</text>
<text x="364.0" y="204.0" font-size="13" fill="#1F2328" text-anchor="start">enterprise (Ids fijos)</text>
<text x="364.0" y="222.0" font-size="13" fill="#1F2328" text-anchor="start">SubscriptionPlanVersion:</text>
<text x="364.0" y="240.0" font-size="13" fill="#1F2328" text-anchor="start">Draft → Published → Superseded</text>
<text x="364.0" y="258.0" font-size="13" fill="#1F2328" text-anchor="start">Módulos, precios, asientos</text>
<rect x="660" y="140" width="280" height="132" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="670.0" y="166.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">Revisión de catálogo</text>
<text x="670.0" y="186.0" font-size="13" fill="#1F2328" text-anchor="start">ICatalogRevision al desplegar</text>
<text x="670.0" y="204.0" font-size="13" fill="#1F2328" text-anchor="start">CatalogRevisionCatalog.All</text>
<text x="670.0" y="222.0" font-size="13" fill="#1F2328" text-anchor="start">(agregar al final, no reordenar)</text>
<text x="670.0" y="240.0" font-size="13" fill="#1F2328" text-anchor="start">Runner: candado + transacción</text>
<text x="670.0" y="258.0" font-size="13" fill="#1F2328" text-anchor="start">Si falla, frena el arranque</text>
<rect x="966" y="140" width="280" height="132" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="976.0" y="166.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">Add-on</text>
<text x="976.0" y="186.0" font-size="13" fill="#1F2328" text-anchor="start">Código module-addon-{code}</text>
<text x="976.0" y="204.0" font-size="13" fill="#1F2328" text-anchor="start">POST addons/checkout</text>
<text x="976.0" y="222.0" font-size="13" fill="#1F2328" text-anchor="start">Cuenta si está Active y la</text>
<text x="976.0" y="240.0" font-size="13" fill="#1F2328" text-anchor="start">base da acceso</text>
<text x="976.0" y="258.0" font-size="13" fill="#1F2328" text-anchor="start">AddOnActivated / AddOnCancelled</text>
<rect x="1272" y="140" width="280" height="132" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="1282.0" y="166.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">Entitlement (snapshot)</text>
<text x="1282.0" y="186.0" font-size="13" fill="#1F2328" text-anchor="start">Desde la edición contratada</text>
<text x="1282.0" y="204.0" font-size="13" fill="#1F2328" text-anchor="start">module.&lt;code&gt;, seats.max,</text>
<text x="1282.0" y="222.0" font-size="13" fill="#1F2328" text-anchor="start">storage.max_bytes, cuotas</text>
<text x="1282.0" y="240.0" font-size="13" fill="#1F2328" text-anchor="start">ContractedEntitlementPolicy</text>
<text x="1282.0" y="258.0" font-size="13" fill="#1F2328" text-anchor="start">Defaults de plataforma</text>
