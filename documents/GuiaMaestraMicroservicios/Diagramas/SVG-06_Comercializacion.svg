<text x="42" y="452" font-size="14" font-weight="700" fill="#1F4E8C">Auth + BuildingBlocks.Authorization (permisos)</text>
<rect x="48" y="470" width="704" height="96" rx="8" ry="8" fill="#E3EAF5" stroke="#1F4E8C" stroke-width="1.6"/>
<text x="58.0" y="496.0" font-size="14" font-weight="700" fill="#1F4E8C" text-anchor="start">PermissionCatalog (Auth) · GUID fijo por permiso</text>
<text x="58.0" y="516.0" font-size="13" fill="#1F2328" text-anchor="start">Constantes en BuildingBlocks/Authorization/&lt;Svc&gt;Permissions.cs</text>
<text x="58.0" y="534.0" font-size="13" fill="#1F2328" text-anchor="start">Module = carpeta UI · bundle TenantAdmin automático; Employee y</text>
<text x="58.0" y="552.0" font-size="13" fill="#1F2328" text-anchor="start">Customer Portal con listas explícitas · techo PermissionCeiling</text>
<rect x="48" y="600" width="704" height="96" rx="8" ry="8" fill="#E3EAF5" stroke="#1F4E8C" stroke-width="1.6"/>
<text x="58.0" y="626.0" font-size="14" font-weight="700" fill="#1F4E8C" text-anchor="start">PermissionModuleMap · prefijo → módulo comercial</text>
<text x="58.0" y="646.0" font-size="13" fill="#1F2328" text-anchor="start">financial. → financial_insights · communication.meeting. → meetings</text>
<text x="58.0" y="664.0" font-size="13" fill="#1F2328" text-anchor="start">Sin prefijo mapeado = siempre efectivo (auth, billing, notification…)</text>
<text x="58.0" y="682.0" font-size="13" fill="#1F2328" text-anchor="start">ModuleCatalogKnownModulesTests: seeder = KnownModules</text>
