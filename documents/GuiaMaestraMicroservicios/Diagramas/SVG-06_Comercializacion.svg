<rect x="30" y="914" width="1540" height="72" rx="8" ry="8" fill="#F7F7F8" stroke="#8C8C96" stroke-width="1.6"/>
<text x="40.0" y="938.0" font-size="13" fill="#1F2328" text-anchor="start">Apagado: estados fuera del acceso (Draft, Suspended, Cancelled, Expired) → module.* = false → proyección [] → el gate deniega (en enforce).</text>
<text x="40.0" y="956.0" font-size="13" fill="#1F2328" text-anchor="start">Ejemplo real FinancialInsights: módulo Commercial $29 / $290, prefijo financial., FinancialInsightsModuleRevision y gate con Enforce "true" literal en compose;</text>
<text x="40.0" y="974.0" font-size="13" fill="#1F2328" text-anchor="start">los otros 14 servicios con gate siguen en log-only salvo que su secret &lt;SVC&gt;_MODULE_GATE_ENFORCE esté en true.</text>
