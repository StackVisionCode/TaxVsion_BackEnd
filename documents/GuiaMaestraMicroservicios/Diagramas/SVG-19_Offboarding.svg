<title>SVG-19 · Retiro (offboarding) de un empleado: flujo completo</title>
<desc>Verificado en Investigaciones/Offboarding.md: UsersController.Offboard, OffboardUserHandler, SessionAccessCutoff, OffboardingRun, OffboardingStepAcknowledgementPolicy, OffboardingRunsSweepJob. Izquierda: síncrono en Auth. Derecha: asíncrono por coreografía.</desc>
<defs><marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D9E"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D4F"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B7791F"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B83232"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B4FA0"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2C7A7B"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/></marker></defs>
<rect x="0" y="0" width="1600" height="1294" fill="#FFFFFF"/>
<rect class="ctr" x="30.0" y="124.0" width="720.0" height="1028.0" rx="8" fill="#FAFBFC" stroke="#C5CAD3" stroke-width="1.2"/>
<text x="40.0" y="147.0" font-size="14" font-weight="700" fill="#111827">Síncrono · un solo comando en Auth</text>
<rect class="ctr" x="780.0" y="124.0" width="790.0" height="826.0" rx="8" fill="#FAFBFC" stroke="#C5CAD3" stroke-width="1.2"/>
<text x="790.0" y="147.0" font-size="14" font-weight="700" fill="#111827">Asíncrono · coreografía con seguimiento</text>
<rect class="ctr" x="30.0" y="1176.0" width="1540.0" height="94.0" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="40.0" y="1199.0" font-size="14" font-weight="700" fill="#111827">Leyenda</text>
<text x="30.0" y="42.0" font-size="24" font-weight="700" fill="#111827">SVG-19 · Retiro (offboarding) de un empleado: flujo completo</text>
<text x="30.0" y="68.0" font-size="14" fill="#4B5563">Verificado en Investigaciones/Offboarding.md: UsersController.Offboard, OffboardUserHandler, SessionAccessCutoff, OffboardingRun, OffboardingStepAcknowledgementPolicy,</text>
<text x="30.0" y="88.0" font-size="14" fill="#4B5563">OffboardingRunsSweepJob. Izquierda: síncrono en Auth. Derecha: asíncrono por coreografía.</text>
<rect class="box" x="46.0" y="160.0" width="688.0" height="62.0" rx="6" fill="#F0EAFB" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="56.0" y="183.0" font-size="14" font-weight="700" fill="#111827">TenantAdmin en el CRM</text>
<text x="56.0" y="206.0" font-size="13" fill="#6B4FA0">•</text>
<text x="70.0" y="206.0" font-size="13" fill="#1F2937">Diálogo Offboard: impacto (GET /auth/offboarding/participants), sucesor, motivo y nota</text>
<rect class="box" x="46.0" y="252.0" width="688.0" height="98.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="56.0" y="275.0" font-size="14" font-weight="700" fill="#111827">POST /auth/users/{userId}/offboard</text>
<text x="56.0" y="298.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="298.0" font-size="13" fill="#1F2937">[HasPermission(users.manage)] · [AllowActorTypes(TenantAdmin, PlatformAdmin)] ·</text>
<text x="70.0" y="316.0" font-size="13" fill="#1F2937">[RateLimit("auth.g.user_manage")]</text>
<text x="56.0" y="334.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="334.0" font-size="13" fill="#1F2937">Cuerpo opcional: SuccessorUserId, Reason, ReasonNote · el tenant sale del JWT</text>
<rect class="box" x="46.0" y="380.0" width="458.0" height="206.0" rx="6" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="56.0" y="403.0" font-size="14" font-weight="700" fill="#111827">Validaciones (antes de mutar)</text>
<text x="56.0" y="426.0" font-size="13" fill="#111827">1.</text>
<text x="80.0" y="426.0" font-size="13" fill="#1F2937">Existe y es del mismo tenant (User.NotFound)</text>
<text x="56.0" y="444.0" font-size="13" fill="#111827">2.</text>
<text x="80.0" y="444.0" font-size="13" fill="#1F2937">No se retira a sí mismo (User.SelfAction)</text>
<text x="56.0" y="462.0" font-size="13" fill="#111827">3.</text>
<text x="80.0" y="462.0" font-size="13" fill="#1F2937">Ya Offboarded → Success sin republicar</text>
<text x="56.0" y="480.0" font-size="13" fill="#111827">4.</text>
<text x="80.0" y="480.0" font-size="13" fill="#1F2937">No es cliente de portal (User.PortalClient)</text>
<text x="56.0" y="498.0" font-size="13" fill="#111827">5.</text>
<text x="80.0" y="498.0" font-size="13" fill="#1F2937">No es el último admin activo (User.LastAdmin, candado</text>
<text x="80.0" y="516.0" font-size="13" fill="#1F2937">del tenant)</text>
<text x="56.0" y="534.0" font-size="13" fill="#111827">6.</text>
<text x="80.0" y="534.0" font-size="13" fill="#1F2937">Sucesor válido: activo, mismo tenant, staff</text>
<text x="80.0" y="552.0" font-size="13" fill="#1F2937">(User.Successor)</text>
<text x="56.0" y="570.0" font-size="13" fill="#111827">7.</text>
<text x="80.0" y="570.0" font-size="13" fill="#1F2937">No es el dueño de la cuenta (User.OwnerSlot)</text>
<rect class="box" x="524.0" y="420.0" width="210.0" height="80.0" rx="6" fill="#FCE8E8" stroke="#B83232" stroke-width="1.5"/>
<text x="534.0" y="443.0" font-size="14" font-weight="700" fill="#111827">Falla</text>
<text x="534.0" y="466.0" font-size="13" fill="#1F2937">Result con Error; no se</text>
<text x="534.0" y="484.0" font-size="13" fill="#1F2937">toca nada</text>
<rect class="box" x="46.0" y="616.0" width="688.0" height="80.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="56.0" y="639.0" font-size="14" font-weight="700" fill="#111827">User.Offboard + RemoveAvatar</text>
<text x="56.0" y="662.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="662.0" font-size="13" fill="#1F2937">Status = Offboarded (terminal), IsActive = false, RemovedAtUtc; libera la prioridad de</text>
<text x="70.0" y="680.0" font-size="13" fill="#1F2937">asiento</text>
<rect class="box" x="46.0" y="726.0" width="688.0" height="98.0" rx="6" fill="#FCE8E8" stroke="#B83232" stroke-width="1.5"/>
<text x="56.0" y="749.0" font-size="14" font-weight="700" fill="#111827">Corte de acceso · SessionAccessCutoff.ForUserAsync</text>
<text x="56.0" y="772.0" font-size="13" fill="#111827">1.</text>
<text x="80.0" y="772.0" font-size="13" fill="#1F2937">Denylist del sid en Redis (TTL 20 min)</text>
<text x="56.0" y="790.0" font-size="13" fill="#111827">2.</text>
<text x="80.0" y="790.0" font-size="13" fill="#1F2937">Pub/Sub auth:session-revoked → Communication expulsa sockets</text>
<text x="56.0" y="808.0" font-size="13" fill="#111827">3.</text>
<text x="80.0" y="808.0" font-size="13" fill="#1F2937">Revocación de sesiones y refresh en BD</text>
<rect class="box" x="46.0" y="854.0" width="688.0" height="62.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="56.0" y="877.0" font-size="14" font-weight="700" fill="#111827">OffboardingHygiene</text>
<text x="56.0" y="900.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="900.0" font-size="13" fill="#1F2937">Purga factores MFA y cancela las invitaciones de staff que envió</text>
<rect class="box" x="46.0" y="946.0" width="688.0" height="98.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="56.0" y="969.0" font-size="14" font-weight="700" fill="#111827">OffboardingRun + auditoría</text>
<text x="56.0" y="992.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="992.0" font-size="13" fill="#1F2937">Pasos esperados de OffboardingParticipants.ExpectedSteps; índice único (TenantId,</text>
<text x="70.0" y="1010.0" font-size="13" fill="#1F2937">UserId)</text>
<text x="56.0" y="1028.0" font-size="13" fill="#2F5D9E">•</text>
<text x="70.0" y="1028.0" font-size="13" fill="#1F2937">AuthAuditAction.UserOffboarded</text>
<rect class="box" x="46.0" y="1074.0" width="688.0" height="62.0" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="56.0" y="1097.0" font-size="14" font-weight="700" fill="#111827">SaveChangesAsync y después PublishAsync</text>
<text x="56.0" y="1120.0" font-size="13" fill="#2E7D4F">•</text>
<text x="70.0" y="1120.0" font-size="13" fill="#1F2937">UserOffboardedIntegrationEvent por outbox durable (misma transacción que el run)</text>
<rect class="box" x="796.0" y="160.0" width="758.0" height="98.0" rx="6" fill="#E6F5F5" stroke="#2C7A7B" stroke-width="1.5"/>
<text x="806.0" y="183.0" font-size="14" font-weight="700" fill="#111827">RabbitMQ · exchange fanout taxvision-events</text>
<text x="806.0" y="206.0" font-size="13" fill="#2C7A7B">•</text>
<text x="820.0" y="206.0" font-size="13" fill="#1F2937">Una cola durable por servicio (&lt;servicio&gt;-events); Communication: communication-events, alias</text>
<text x="820.0" y="224.0" font-size="13" fill="#1F2937">auth.user.offboarded.v1</text>
<text x="806.0" y="242.0" font-size="13" fill="#2C7A7B">•</text>
<text x="820.0" y="242.0" font-size="13" fill="#1F2937">27 servicios, 51 pasos registrados en OffboardingParticipants</text>
<rect class="box" x="796.0" y="288.0" width="758.0" height="170.0" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="806.0" y="311.0" font-size="14" font-weight="700" fill="#111827">Consumers (ejemplos; matriz completa en SVG-20)</text>
<text x="806.0" y="334.0" font-size="13" fill="#9CA3AF">•</text>
<text x="820.0" y="334.0" font-size="13" fill="#1F2937">25 servicios: UserLifecyclePermissionsProjectionConsumer → proyección IsActive = false</text>
<text x="806.0" y="352.0" font-size="13" fill="#9CA3AF">•</text>
<text x="820.0" y="352.0" font-size="13" fill="#1F2937">Customer, Tasks, Calendar, Signature, Correspondence, Campaigns: trabajo activo al sucesor o</text>
<text x="820.0" y="370.0" font-size="13" fill="#1F2937">cerrado con aviso</text>
<text x="806.0" y="388.0" font-size="13" fill="#9CA3AF">•</text>
<text x="820.0" y="388.0" font-size="13" fill="#1F2937">Connectors, CloudStorage, Notification: credenciales revocadas o marcadas para revisión</text>
<text x="806.0" y="406.0" font-size="13" fill="#9CA3AF">•</text>
<text x="820.0" y="406.0" font-size="13" fill="#1F2937">Reminder: recordatorios cancelados · Tenant: coordinador WISP vacante</text>
<text x="806.0" y="424.0" font-size="13" fill="#9CA3AF">•</text>
<text x="820.0" y="424.0" font-size="13" fill="#1F2937">Eventos derivados (CustomerPreparerAssigned, ShareLinkRevoked, …) → Notification avisa a la</text>
<text x="820.0" y="442.0" font-size="13" fill="#1F2937">oficina</text>
<rect class="box" x="796.0" y="488.0" width="758.0" height="98.0" rx="6" fill="#E6F5F5" stroke="#2C7A7B" stroke-width="1.5"/>
<text x="806.0" y="511.0" font-size="14" font-weight="700" fill="#111827">Acuse por paso: UserOffboardingStepCompletedIntegrationEvent</text>
<text x="806.0" y="534.0" font-size="13" fill="#2C7A7B">•</text>
<text x="820.0" y="534.0" font-size="13" fill="#1F2937">.NET automático: OffboardingStepAcknowledgementPolicy, un acuse por clase handler, en la misma</text>
<text x="820.0" y="552.0" font-size="13" fill="#1F2937">transacción</text>
<text x="806.0" y="570.0" font-size="13" fill="#2C7A7B">•</text>
<text x="820.0" y="570.0" font-size="13" fill="#1F2937">Node: a mano al final del consumer · si un handler falla no sale acuse de esa cadena</text>
<rect class="box" x="796.0" y="616.0" width="758.0" height="62.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="806.0" y="639.0" font-size="14" font-weight="700" fill="#111827">Auth · OffboardingStepCompletedConsumer</text>
<text x="806.0" y="662.0" font-size="13" fill="#2F5D9E">•</text>
<text x="820.0" y="662.0" font-size="13" fill="#1F2937">Idempotente por Service + Step; paso no esperado o run inexistente → log y descarte</text>
<rect class="box" x="796.0" y="708.0" width="758.0" height="116.0" rx="6" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="806.0" y="731.0" font-size="14" font-weight="700" fill="#111827">OffboardingRunsSweepJob (cada 5 min, lock SQL)</text>
<text x="806.0" y="754.0" font-size="13" fill="#B7791F">•</text>
<text x="820.0" y="754.0" font-size="13" fill="#1F2937">Run con más de 30 min sin todos los acuses → MarkOffboardingRunIncompleteCommand</text>
<text x="806.0" y="772.0" font-size="13" fill="#B7791F">•</text>
<text x="820.0" y="772.0" font-size="13" fill="#1F2937">Guarda y publica UserOffboardingIncompleteIntegrationEvent con los pasos pendientes (una sola</text>
<text x="820.0" y="790.0" font-size="13" fill="#1F2937">vez)</text>
<text x="806.0" y="808.0" font-size="13" fill="#B7791F">•</text>
<text x="820.0" y="808.0" font-size="13" fill="#1F2937">Un acuse tardío convierte Incomplete en Completed</text>
<rect class="box" x="796.0" y="854.0" width="371.0" height="80.0" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="806.0" y="877.0" font-size="14" font-weight="700" fill="#111827">Notification</text>
<text x="806.0" y="900.0" font-size="13" fill="#1F2937">Aviso a los admins (plantilla</text>
<text x="806.0" y="918.0" font-size="13" fill="#1F2937">auth.offboarding.incomplete en Scribe)</text>
<rect class="box" x="1183.0" y="854.0" width="371.0" height="62.0" rx="6" fill="#F0EAFB" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="1193.0" y="877.0" font-size="14" font-weight="700" fill="#111827">CRM · Handover status N/N</text>
<text x="1193.0" y="900.0" font-size="13" fill="#1F2937">GET /auth/users/{userId}/offboarding-status</text>
<rect class="sw" x="42.0" y="1216.0" width="30" height="16" rx="3" fill="#F0EAFB" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="82.0" y="1229.0" font-size="13" fill="#1F2937">Actor / UI</text>
<rect class="sw" x="179.0" y="1216.0" width="30" height="16" rx="3" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="219.0" y="1229.0" font-size="13" fill="#1F2937">Paso en Auth</text>
<rect class="sw" x="331.0" y="1216.0" width="30" height="16" rx="3" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="371.0" y="1229.0" font-size="13" fill="#1F2937">Validación / seguimiento</text>
<rect class="sw" x="573.0" y="1216.0" width="30" height="16" rx="3" fill="#FCE8E8" stroke="#B83232" stroke-width="1.5"/>
<text x="613.0" y="1229.0" font-size="13" fill="#1F2937">Corte de acceso / error</text>
<rect class="sw" x="807.5" y="1216.0" width="30" height="16" rx="3" fill="#E6F5F5" stroke="#2C7A7B" stroke-width="1.5"/>
<text x="847.5" y="1229.0" font-size="13" fill="#1F2937">Mensajería</text>
<rect class="sw" x="944.5" y="1216.0" width="30" height="16" rx="3" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="984.5" y="1229.0" font-size="13" fill="#1F2937">Persistencia y aviso</text>
