<text x="1070.0" y="598.0" font-size="13" fill="#2C7A7B">•</text>
<text x="1084.0" y="598.0" font-size="13" fill="#1F2937">Vitest de Communication, Recorder y TranscriptWorker, en local</text>
<text x="1070.0" y="616.0" font-size="13" fill="#2C7A7B">•</text>
<text x="1084.0" y="616.0" font-size="13" fill="#1F2937">No entran al .slnx ni al gate de .NET</text>
