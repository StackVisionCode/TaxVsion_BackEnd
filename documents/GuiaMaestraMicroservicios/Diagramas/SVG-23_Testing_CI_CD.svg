<title>SVG-23 · Pipeline de calidad real: del cambio al despliegue</title>
<desc>Estado al 2026-11-15: el workflow deploy.yml no corre pruebas (decisión del dueño del 2026-11-13). Toda la calidad depende del gate local y de las .Integration. corridas por quien hace el cambio. Fuentes: CI_CD_Secrets.md, Testing_*.md, AGENTS.md.</desc>
