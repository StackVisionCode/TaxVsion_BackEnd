<rect x="0" y="0" width="1600" height="864" fill="#FFFFFF"/>
<rect class="ctr" x="30.0" y="746.0" width="1540.0" height="94.0" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="40.0" y="769.0" font-size="14" font-weight="700" fill="#111827">Leyenda</text>
<text x="30.0" y="42.0" font-size="24" font-weight="700" fill="#111827">SVG-23 · Pipeline de calidad real: del cambio al despliegue</text>
<text x="30.0" y="68.0" font-size="14" fill="#4B5563">Estado al 2026-11-15: el workflow deploy.yml no corre pruebas (decisión del dueño del 2026-11-13). Toda la calidad depende del gate local y de las .Integration. corridas por quien hace el</text>
<text x="30.0" y="88.0" font-size="14" fill="#4B5563">cambio. Fuentes: CI_CD_Secrets.md, Testing_*.md, AGENTS.md.</text>
<rect class="box" x="30.0" y="172.0" width="276.0" height="116.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="40.0" y="195.0" font-size="14" font-weight="700" fill="#111827">1 · Prueba primero</text>
<text x="40.0" y="218.0" font-size="13" fill="#1F2937">Escribir la prueba del cambio</text>
<text x="40.0" y="236.0" font-size="13" fill="#1F2937">(clase por clase, sin números de</text>
<text x="40.0" y="254.0" font-size="13" fill="#1F2937">fase)</text>
<rect class="box" x="346.0" y="172.0" width="276.0" height="116.0" rx="6" fill="#FCE8E8" stroke="#B83232" stroke-width="1.5"/>
<text x="356.0" y="195.0" font-size="14" font-weight="700" fill="#111827">2 · Rojo</text>
<text x="356.0" y="218.0" font-size="13" fill="#1F2937">Correrla: tiene que fallar con el</text>
<text x="356.0" y="236.0" font-size="13" fill="#1F2937">código actual y se muestra la</text>
<text x="356.0" y="254.0" font-size="13" fill="#1F2937">salida</text>
<rect class="box" x="662.0" y="172.0" width="276.0" height="116.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="672.0" y="195.0" font-size="14" font-weight="700" fill="#111827">3 · Arreglo mínimo</text>
<text x="672.0" y="218.0" font-size="13" fill="#1F2937">Sin refactors extra; dominio con</text>
<text x="672.0" y="236.0" font-size="13" fill="#1F2937">Result / Error</text>
<rect class="box" x="978.0" y="172.0" width="276.0" height="116.0" rx="6" fill="#E8F0FB" stroke="#2F5D9E" stroke-width="1.5"/>
<text x="988.0" y="195.0" font-size="14" font-weight="700" fill="#111827">4 · CSharpier</text>
<text x="988.0" y="218.0" font-size="13" fill="#1F2937">dotnet csharpier format sobre lo</text>
<text x="988.0" y="236.0" font-size="13" fill="#1F2937">tocado (printWidth 120)</text>
<text x="988.0" y="254.0" font-size="13" font-style="italic" fill="#4B5563">Puede romper fitness de tamaño</text>
<rect class="box" x="1294.0" y="172.0" width="276.0" height="116.0" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="1304.0" y="195.0" font-size="14" font-weight="700" fill="#111827">5 · Gate local exacto</text>
<text x="1304.0" y="218.0" font-size="13" fill="#1F2937">dotnet test TaxVision.slnx con el</text>
<text x="1304.0" y="236.0" font-size="13" fill="#1F2937">filtro !~.Integration. &amp;</text>
<text x="1304.0" y="254.0" font-size="13" fill="#1F2937">!~.Persistence. &amp;</text>
<text x="1304.0" y="272.0" font-size="13" fill="#1F2937">!~ReminderRetentionJobTests</text>
<rect class="box" x="1294.0" y="358.0" width="276.0" height="154.0" rx="6" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="1304.0" y="381.0" font-size="14" font-weight="700" fill="#111827">6 · .Integration. del</text>
<text x="1304.0" y="401.0" font-size="14" font-weight="700" fill="#111827">servicio</text>
<text x="1304.0" y="424.0" font-size="13" fill="#1F2937">Contra SQL local si se tocó</text>
<text x="1304.0" y="442.0" font-size="13" fill="#1F2937">persistencia o un handler recibe</text>
<text x="1304.0" y="460.0" font-size="13" fill="#1F2937">una dependencia nueva</text>
<text x="1304.0" y="478.0" font-size="13" font-style="italic" fill="#4B5563">Migración creada y aplicada en</text>
<text x="1304.0" y="496.0" font-size="13" font-style="italic" fill="#4B5563">local</text>
<rect class="box" x="978.0" y="358.0" width="276.0" height="154.0" rx="6" fill="#E6F5F5" stroke="#2C7A7B" stroke-width="1.5"/>
<text x="988.0" y="381.0" font-size="14" font-weight="700" fill="#111827">7 · Wiring de despliegue</text>
<text x="988.0" y="404.0" font-size="13" fill="#1F2937">Deploy/*Tests leen compose,</text>
<text x="988.0" y="422.0" font-size="13" fill="#1F2937">Dockerfile, Caddyfile y deploy.yml</text>
<text x="988.0" y="440.0" font-size="13" fill="#1F2937">(ya dentro del gate)</text>
<text x="988.0" y="458.0" font-size="13" font-style="italic" fill="#4B5563">Pensar en Linux: el runner es</text>
<text x="988.0" y="476.0" font-size="13" font-style="italic" fill="#4B5563">Linux</text>
<rect class="box" x="662.0" y="358.0" width="276.0" height="154.0" rx="6" fill="#F0EAFB" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="672.0" y="381.0" font-size="14" font-weight="700" fill="#111827">8 · Commit y push del dueño</text>
<text x="672.0" y="404.0" font-size="13" fill="#1F2937">Solo el dueño hace commit y push;</text>
<text x="672.0" y="422.0" font-size="13" fill="#1F2937">el push a main despliega</text>
<rect class="box" x="346.0" y="358.0" width="276.0" height="154.0" rx="6" fill="#F1F3F5" stroke="#6B7280" stroke-width="1.5"/>
<text x="356.0" y="381.0" font-size="14" font-weight="700" fill="#111827">9 · deploy.yml</text>
<text x="356.0" y="404.0" font-size="13" fill="#1F2937">Jobs stage y deploy: build,</text>
<text x="356.0" y="422.0" font-size="13" fill="#1F2937">migraciones, up -d</text>
<text x="356.0" y="440.0" font-size="13" fill="#B83232">Sin pruebas hoy</text>
<rect class="box" x="30.0" y="358.0" width="276.0" height="154.0" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="40.0" y="381.0" font-size="14" font-weight="700" fill="#111827">10 · Verificación</text>
<text x="40.0" y="401.0" font-size="14" font-weight="700" fill="#111827">post-deploy</text>
<text x="40.0" y="424.0" font-size="13" fill="#1F2937">Healthcheck /health/ready en el</text>
<text x="40.0" y="442.0" font-size="13" fill="#1F2937">dominio de la API</text>
<text x="40.0" y="460.0" font-size="13" fill="#1F2937">(TAXVISION_DOMAIN), logs "code</text>
<text x="40.0" y="478.0" font-size="13" fill="#1F2937">generation mode is Static" y</text>
<text x="40.0" y="496.0" font-size="13" fill="#1F2937">prueba manual en vivo</text>
<rect class="box" x="30.0" y="552.0" width="255.0" height="170.0" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="40.0" y="575.0" font-size="14" font-weight="700" fill="#111827">Reglas del ciclo</text>
<text x="40.0" y="598.0" font-size="13" fill="#9CA3AF">•</text>
<text x="54.0" y="598.0" font-size="13" fill="#1F2937">Infraestructura real solo en</text>
<text x="54.0" y="616.0" font-size="13" fill="#1F2937">namespace .Integration. (si</text>
<text x="54.0" y="634.0" font-size="13" fill="#1F2937">no, rompe en Linux)</text>
<text x="40.0" y="652.0" font-size="13" fill="#9CA3AF">•</text>
<text x="54.0" y="652.0" font-size="13" fill="#1F2937">Cerrar VBCSCompiler y</text>
<text x="54.0" y="670.0" font-size="13" fill="#1F2937">testhost al terminar</text>
<text x="40.0" y="688.0" font-size="13" fill="#9CA3AF">•</text>
<text x="54.0" y="688.0" font-size="13" fill="#1F2937">Sin commit, push, stash ni</text>
<text x="54.0" y="706.0" font-size="13" fill="#1F2937">cambio de rama por agentes</text>
<rect class="box" x="300.0" y="552.0" width="520.0" height="98.0" rx="6" fill="#F0EAFB" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="310.0" y="575.0" font-size="14" font-weight="700" fill="#111827">Decisión del dueño (vigente)</text>
<text x="310.0" y="598.0" font-size="13" fill="#6B4FA0">•</text>
<text x="324.0" y="598.0" font-size="13" fill="#1F2937">Sin pruebas en CI desde 2026-11-13 (no reabrir): saturaban</text>
<text x="324.0" y="616.0" font-size="13" fill="#1F2937">el runner, que es la misma VM de producción</text>
<text x="310.0" y="634.0" font-size="13" fill="#6B4FA0">•</text>
<text x="324.0" y="634.0" font-size="13" fill="#1F2937">Hoy un push a main con pruebas rojas despliega igual</text>
