<rect x="0" y="0" width="1500" height="900" fill="#FFFFFF"/>
<text x="30" y="40" font-size="24" font-weight="700" fill="#1F2328">Creación de un microservicio, de principio a fin</text>
<text x="30" y="66" font-size="14" fill="#555B63">Trece pasos en orden; cada uno tiene un punto de control (prueba o guardarraíl) que debe quedar en verde antes de seguir</text>
