<text x="58.0" y="174.0" font-size="13" fill="#1F2328" text-anchor="start">¿Nadie lo llama en su write</text>
<text x="58.0" y="192.0" font-size="13" fill="#1F2328" text-anchor="start">path? (ADR-018)</text>
<text x="58.0" y="210.0" font-size="13" fill="#1F2328" text-anchor="start">Worker si cambia el cómputo</text>
