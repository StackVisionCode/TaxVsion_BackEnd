<text x="58.0" y="278.0" font-size="13" fill="#1F2328" text-anchor="start">servicio existente (Growth)</text>
<rect x="332" y="110" width="264" height="118" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="342.0" y="136.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">2 · Estructura + tests</text>
<text x="342.0" y="156.0" font-size="13" fill="#1F2328" text-anchor="start">Domain / Application /</text>
<text x="342.0" y="174.0" font-size="13" fill="#1F2328" text-anchor="start">Infrastructure / Api + .slnx</text>
<text x="342.0" y="192.0" font-size="13" fill="#1F2328" text-anchor="start">TaxVision.&lt;Svc&gt;.Tests</text>
<text x="342.0" y="210.0" font-size="13" fill="#1F2328" text-anchor="start">Referencia: Notes (y Customer)</text>
