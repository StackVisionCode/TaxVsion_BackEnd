<text x="342.0" y="278.0" font-size="13" fill="#1F2328" text-anchor="start">PreGeneratedHandlerCodeTests</text>
<rect x="616" y="110" width="264" height="118" rx="8" ry="8" fill="#E9F5EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="626.0" y="136.0" font-size="14" font-weight="700" fill="#2E7D4F" text-anchor="start">3 · Dominio</text>
<text x="626.0" y="156.0" font-size="13" fill="#1F2328" text-anchor="start">Agregados ricos (AggregateRoot)</text>
