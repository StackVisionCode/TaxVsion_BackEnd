<text x="626.0" y="192.0" font-size="13" fill="#1F2328" text-anchor="start">IDomainEvent en el agregado</text>
<text x="626.0" y="210.0" font-size="13" fill="#1F2328" text-anchor="start">Hora recibida (TimeProvider)</text>
